<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>Gamenfy — Command Center</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<script src="xp.js" defer></script>
<style>
:root {
  --bg: #F4F3EF;
  --card: #FFFFFF;
  --ink: #15140F;
  --ink-card: #181712;
  --muted: #6F6C63;
  --faint: #A6A399;
  --line: #E8E6DF;
  --line-strong: #DBD8CF;
  --ember: #D4633E;
  --ember-deep: #B14E2E;
  --gold: #C9A227;
  --green: #2E8B5F;
  --scan: #4FC3D9;
  --font-display: 'Schibsted Grotesk', -apple-system, sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  overflow-x: hidden;
  padding: 12px 16px 24px;
}
.page { max-width: 600px; margin: 0 auto; }

/* ── Character strip ─────────────────────────────── */
.char-strip {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  text-decoration: none;
  margin-bottom: 20px;
  transition: box-shadow 0.15s;
}
.char-strip:active { box-shadow: 0 0 0 2px var(--ember); }
.char-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--ink-card);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.char-name {
  font-family: var(--font-display); font-weight: 700;
  font-size: 15px; color: var(--ink);
}
.char-sub {
  font-size: 11px; color: var(--muted);
  margin-top: 1px;
}
.char-level {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
}
.char-level-badge {
  background: var(--ink); color: var(--gold);
  font-family: var(--font-display); font-weight: 800;
  font-size: 16px; font-variant-numeric: tabular-nums;
  padding: 4px 10px; border-radius: 8px;
  letter-spacing: -0.02em;
}
.char-chevron { color: var(--faint); font-size: 14px; }

/* ── Greeting ─────────────────────────────────────── */
.greeting {
  margin-bottom: 20px;
}
.greeting-time {
  font-family: var(--font-display); font-weight: 700;
  font-size: 22px; color: var(--ink); line-height: 1.1;
}
.greeting-date {
  font-size: 12px; color: var(--muted); margin-top: 3px;
}

/* ── Section header ──────────────────────────────── */
.sec-head {
  font-family: var(--font-display); font-weight: 700;
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
}

/* ── Day Arc ─────────────────────────────────────── */
.day-arc-card {
  background: var(--ink-card);
  border-radius: 20px;
  padding: 20px 20px 16px;
  margin-bottom: 20px;
  position: relative; overflow: hidden;
}
.arc-wrap {
  display: flex; justify-content: center;
  margin-bottom: 16px;
}
.arc-svg { overflow: visible; }
.arc-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 8; stroke-linecap: round; }
.arc-fill  { fill: none; stroke: var(--ember); stroke-width: 8; stroke-linecap: round;
  transition: stroke-dashoffset 0.9s cubic-bezier(0.25,0.46,0.45,0.94); }
.arc-pct {
  font-family: var(--font-display); font-weight: 800;
  font-size: 28px; fill: #FAFAFA; text-anchor: middle;
  font-variant-numeric: tabular-nums;
}
.arc-label {
  font-family: var(--font-body); font-size: 10px;
  fill: rgba(255,255,255,0.45); text-anchor: middle;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.arc-stats {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 1px; border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 14px;
}
.arc-stat { text-align: center; }
.arc-stat-val {
  font-family: var(--font-display); font-weight: 700;
  font-size: 18px; color: #FAFAFA;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.arc-stat-val.gold { color: var(--gold); }
.arc-stat-lbl {
  font-size: 9px; color: rgba(255,255,255,0.4);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-top: 3px;
}

/* ── Missions ────────────────────────────────────── */
.missions-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  margin-bottom: 20px;
  overflow: hidden;
}
.mission-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.mission-row:last-child { border-bottom: none; }
.mission-row:active { background: #F9F8F4; }
.mission-row.done { opacity: 0.5; }
.mission-check {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--line-strong);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; background: transparent;
}
.mission-row.done .mission-check {
  background: var(--green); border-color: var(--green);
}
.mission-check-icon { display: none; font-size: 11px; color: white; }
.mission-row.done .mission-check-icon { display: block; }
.mission-info { flex: 1; }
.mission-name {
  font-size: 14px; font-weight: 600; color: var(--ink);
}
.mission-streak {
  font-size: 11px; color: var(--muted); margin-top: 2px;
}
.mission-xp {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  color: var(--ember); background: rgba(212,99,62,0.08);
  padding: 2px 8px; border-radius: 6px; white-space: nowrap;
}

/* ── Focus skills ───────────────────────────────── */
.focus-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}
.focus-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: box-shadow 0.15s;
}
.focus-card.open {
  grid-column: 1 / -1;
  box-shadow: 0 0 0 2px var(--ember);
}
.focus-card-top {
  display: flex; align-items: flex-start; gap: 8px;
}
.focus-lvl-badge {
  background: var(--ink); color: var(--gold);
  font-family: var(--font-display); font-weight: 800;
  font-size: 18px; font-variant-numeric: tabular-nums;
  padding: 3px 8px; border-radius: 7px; flex-shrink: 0;
  letter-spacing: -0.02em;
}
.focus-name {
  font-family: var(--font-display); font-weight: 700;
  font-size: 14px; color: var(--ink); line-height: 1.2;
}
.focus-domain {
  font-size: 10px; color: var(--muted); margin-top: 2px;
}
.focus-next {
  font-size: 10px; color: var(--muted);
  margin: 8px 0 6px; line-height: 1.4;
}
.focus-next strong { color: var(--ink); }
.focus-bar-track {
  height: 3px; background: var(--line);
  border-radius: 2px; margin-bottom: 0;
}
.focus-bar-fill {
  height: 3px; background: var(--ember);
  border-radius: 2px; transition: width 0.4s;
}
/* expanded */
.focus-expand { display: none; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.focus-card.open .focus-expand { display: block; }
.focus-log-btns {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 12px;
}
.focus-log-btn {
  flex: 1; min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 10px;
  font-family: var(--font-body); font-size: 12px;
  color: var(--ink); font-weight: 600;
  cursor: pointer; text-align: left;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s;
}
.focus-log-btn:active { background: var(--line); }
.focus-log-btn .xp-tag {
  display: block; font-size: 10px;
  color: var(--ember); font-weight: 700;
  margin-top: 2px;
}
.focus-unlock-title {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted); margin-bottom: 8px;
}
.focus-ms-row {
  display: flex; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid var(--line);
}
.focus-ms-row:last-child { border-bottom: none; }
.focus-ms-status { font-size: 13px; width: 18px; flex-shrink: 0; }
.focus-ms-text { font-size: 12px; color: var(--muted); line-height: 1.4; }
.focus-ms-text.done { color: var(--green); text-decoration: line-through; }
.focus-ms-text.next { color: var(--ink); font-weight: 600; }

/* ── Core tracker ───────────────────────────────── */
.core-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  margin-bottom: 20px;
  overflow: hidden;
}
.core-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--line);
}
.core-head-label {
  font-family: var(--font-display); font-weight: 700;
  font-size: 13px; color: var(--ink);
}
.core-head-sub { font-size: 11px; color: var(--muted); }
.core-skills {
  display: grid; grid-template-columns: 1fr 1fr;
}
.core-skill {
  padding: 14px;
  border-right: 1px solid var(--line);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.core-skill:nth-child(even) { border-right: none; }
.core-skill-icon { font-size: 24px; margin-bottom: 6px; }
.core-skill-name {
  font-family: var(--font-display); font-weight: 700;
  font-size: 13px; color: var(--ink); margin-bottom: 2px;
}
.core-skill-level {
  font-family: var(--font-display); font-weight: 800;
  font-size: 22px; color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.core-skill-next {
  font-size: 10px; color: var(--muted); margin-top: 4px;
  line-height: 1.3;
}
.core-bar-track {
  height: 3px; background: var(--line);
  border-radius: 2px; margin-top: 8px;
}
.core-bar-fill {
  height: 3px; background: var(--ember);
  border-radius: 2px;
}

/* ── XP toast ────────────────────────────────────── */
.dl-toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom,0px) + 72px);
  right: 16px; left: 16px;
  max-width: 360px; margin: 0 auto;
  background: var(--ink); color: #FAFAFA;
  font-family: var(--font-body); font-size: 13px; font-weight: 600;
  padding: 10px 16px; border-radius: 12px;
  pointer-events: none; z-index: 9999;
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
}
.dl-toast.show { opacity: 1; transform: translateY(0); }

/* ── Daily Quote ─────────────────────────────────── */
.quote-card {
  position: relative;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(201,162,39,0.10), transparent 55%),
    linear-gradient(135deg, #FBF9F3 0%, #F3EFE3 100%);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 18px 16px;
  margin-bottom: 20px;
  overflow: hidden;
}
.quote-card::before {
  content: '"';
  position: absolute; top: -14px; left: 12px;
  font-family: var(--font-display); font-weight: 800;
  font-size: 92px; color: rgba(201,162,39,0.18);
  line-height: 1;
}
.quote-text {
  position: relative; z-index: 1;
  font-family: var(--font-display); font-weight: 600;
  font-size: 16px; line-height: 1.4; color: var(--ink);
  letter-spacing: -0.01em;
}
.quote-author {
  position: relative; z-index: 1;
  margin-top: 8px; font-size: 12px; color: var(--gold);
  font-weight: 600; font-style: italic;
}

/* ── Agenda ──────────────────────────────────────── */
.agenda-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  margin-bottom: 20px;
  overflow: hidden;
}
.agenda-daynav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  background: linear-gradient(135deg, #1B1A15 0%, #2A2620 100%);
  position: relative;
}
.agenda-daynav::after {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(80% 120% at 90% 10%, rgba(201,162,39,0.20), transparent 50%),
    repeating-linear-gradient(115deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 9px);
  pointer-events: none;
}
.agenda-nav-btn {
  position: relative; z-index: 1;
  width: 34px; height: 34px; border-radius: 10px;
  border: 1px solid rgba(201,162,39,0.35);
  background: rgba(255,255,255,0.04);
  color: var(--gold); font-size: 16px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, background 0.15s;
}
.agenda-nav-btn:active { transform: scale(0.9); background: rgba(201,162,39,0.15); }
.agenda-day-label {
  position: relative; z-index: 1; text-align: center;
}
.agenda-day-name {
  font-family: var(--font-display); font-weight: 800;
  font-size: 16px; color: #F4F3EF; letter-spacing: -0.01em;
}
.agenda-day-sub {
  font-size: 10px; color: var(--gold); margin-top: 1px;
  text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
}
.agenda-day-label.is-today .agenda-day-name::after {
  content: '· TODAY'; color: var(--gold); font-size: 10px;
  letter-spacing: 0.1em; margin-left: 6px;
}
.agenda-body {
  max-height: 340px; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.agenda-hour {
  display: flex; align-items: stretch;
  border-bottom: 1px solid var(--line);
  min-height: 46px;
}
.agenda-hour:last-child { border-bottom: none; }
.agenda-hour-label {
  width: 52px; flex-shrink: 0;
  padding: 6px 8px 0 12px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--faint); text-align: right;
}
.agenda-hour-slot {
  flex: 1; padding: 5px 12px 5px 6px;
  display: flex; flex-direction: column; gap: 4px;
  cursor: pointer; min-width: 0;
}
.agenda-hour-slot:active { background: rgba(201,162,39,0.05); }
.agenda-block {
  border-radius: 9px; padding: 7px 10px;
  font-size: 12px; font-weight: 600; color: #fff;
  display: flex; align-items: center; gap: 7px;
  position: relative; line-height: 1.25;
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
}
.agenda-block-icon { font-size: 13px; flex-shrink: 0; }
.agenda-block-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agenda-block-x {
  flex-shrink: 0; opacity: 0.7; font-size: 14px;
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.2);
}
.agenda-block.done { opacity: 0.55; }
.agenda-block.done .agenda-block-text { text-decoration: line-through; }
.agenda-empty-hint {
  padding: 20px 16px; text-align: center;
  font-size: 12px; color: var(--faint);
}

/* Planner chips (tap a mission/skill to plan it) */
.plan-tray {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 12px 14px; margin-bottom: 20px;
}
.plan-tray-title {
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px;
}
.plan-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.plan-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 20px;
  border: 1px solid var(--line-strong); background: var(--bg);
  font-size: 12px; font-weight: 600; color: var(--ink);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, border-color 0.15s, background 0.15s;
}
.plan-chip:active { transform: scale(0.94); }
.plan-chip.armed {
  border-color: var(--ember); background: rgba(212,99,62,0.08);
  box-shadow: 0 0 0 2px rgba(212,99,62,0.15);
}
.plan-chip-icon { font-size: 13px; }

/* time-picker popover */
.timepick-bg {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(20,19,15,0.45); backdrop-filter: blur(2px);
  display: flex; align-items: flex-end; justify-content: center;
}
.timepick {
  background: #fff; border-radius: 22px 22px 0 0;
  width: 100%; max-width: 480px; padding: 18px 16px max(24px, env(safe-area-inset-bottom));
}
.timepick-title {
  font-family: var(--font-display); font-weight: 800; font-size: 17px;
  margin-bottom: 2px;
}
.timepick-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.timepick-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.timepick-slot {
  padding: 12px 4px; border-radius: 11px; border: 1px solid var(--line-strong);
  background: var(--bg); font-family: var(--font-mono); font-size: 13px;
  font-weight: 700; color: var(--ink); cursor: pointer;
}
.timepick-slot:active { background: rgba(201,162,39,0.12); border-color: var(--gold); }
.timepick-cancel {
  width: 100%; margin-top: 12px; padding: 12px; border: none;
  background: transparent; color: var(--muted); font-size: 14px;
  font-family: inherit; cursor: pointer;
}

@media (max-width: 480px) {
  body { padding: 10px 14px 16px; }
  .focus-grid { grid-template-columns: 1fr; }
  .focus-card.open { grid-column: 1; }
}
</style>
</head>
<body>
<div class="page">

  <!-- Character strip -->
  <a href="character.html" class="char-strip" id="charStrip">
    <div class="char-avatar">🧠</div>
    <div>
      <div class="char-name">Joey</div>
      <div class="char-sub" id="charSubLine">Loading…</div>
    </div>
    <div class="char-level">
      <div class="char-level-badge" id="charTotalLevel">—</div>
      <div class="char-chevron">›</div>
    </div>
  </a>

  <!-- Greeting -->
  <div class="greeting">
    <div class="greeting-time" id="greetingText">Good morning, Joey</div>
    <div class="greeting-date" id="greetingDate"></div>
  </div>

  <!-- Daily Quote -->
  <div class="quote-card" id="quoteCard">
    <div class="quote-text" id="quoteText">…</div>
    <div class="quote-author" id="quoteAuthor"></div>
  </div>

  <!-- Agenda -->
  <div class="sec-head">Agenda</div>
  <div class="agenda-card">
    <div class="agenda-daynav">
      <button class="agenda-nav-btn" onclick="agendaShift(-1)" aria-label="Previous day">‹</button>
      <div class="agenda-day-label" id="agendaDayLabel">
        <div class="agenda-day-name" id="agendaDayName">Today</div>
        <div class="agenda-day-sub" id="agendaDaySub"></div>
      </div>
      <button class="agenda-nav-btn" onclick="agendaShift(1)" aria-label="Next day">›</button>
    </div>
    <div class="agenda-body" id="agendaBody"></div>
  </div>

  <!-- Planner tray: tap a chip then tap a time slot -->
  <div class="plan-tray" id="planTray" style="display:none">
    <div class="plan-tray-title">Tap to schedule · then pick a time</div>
    <div class="plan-chips" id="planChips"></div>
  </div>

  <!-- Day Arc -->
  <div class="sec-head">Day Score</div>
  <div class="day-arc-card" id="dayArcCard">
    <div class="arc-wrap">
      <svg class="arc-svg" width="160" height="90" viewBox="0 0 160 90">
        <!-- half-circle track, left to right -->
        <path class="arc-track" id="arcTrack" d=""/>
        <path class="arc-fill"  id="arcFill"  d=""/>
        <text class="arc-pct"   id="arcPct"  x="80" y="82">0%</text>
        <text class="arc-label" id="arcLbl"  x="80" y="95">Missions Done</text>
      </svg>
    </div>
    <div class="arc-stats">
      <div class="arc-stat">
        <div class="arc-stat-val" id="arcXpToday">0</div>
        <div class="arc-stat-lbl">XP Today</div>
      </div>
      <div class="arc-stat">
        <div class="arc-stat-val gold" id="arcTotalLevel">—</div>
        <div class="arc-stat-lbl">Total Level</div>
      </div>
      <div class="arc-stat">
        <div class="arc-stat-val" id="arcBestStreak">0</div>
        <div class="arc-stat-lbl">Top Habit</div>
      </div>
    </div>
  </div>

  <!-- Today's Missions -->
  <div class="sec-head">Today's Missions</div>

<div class="dl-toast" id="dlToast"></div>

<script>
// ── Helpers ──────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function greeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}
function fmtDate() {
  return new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}
function showToast(msg, dur=2200) {
  const t = document.getElementById('dlToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

// ── Greeting render ──────────────────────────────────────────
function renderGreeting() {
  const gt = document.getElementById('greetingText');
  const gd = document.getElementById('greetingDate');
  if (gt) gt.textContent = greeting() + ', Joey';
  if (gd) gd.textContent = fmtDate();
}

// ── Character strip ──────────────────────────────────────────
function renderCharStrip() {
  if (!window.getCharacter || !window.xpToLevel) return;
  const char = window.getCharacter();
  const skills = char.skills || {};
  const defaults = window.RPG_DEFAULT_SKILLS || {};
  let totalXp = 0;
  let activeCount = 0;
  for (const [k, s] of Object.entries(skills)) {
    const def = defaults[k] || {};
    if (def.isHabit || def.private || s.active === false) continue;
    totalXp += (s.xp || 0);
    activeCount++;
  }
  const totalLevel = window.xpToLevel(totalXp / Math.max(1, activeCount));
  document.getElementById('charTotalLevel').textContent = totalLevel;
  document.getElementById('charSubLine').textContent = activeCount + ' active skills';
  document.getElementById('arcTotalLevel').textContent = totalLevel;
}

// ── Day Arc SVG ──────────────────────────────────────────────
function polarToXY(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function halfArcPath(cx, cy, r, startDeg, endDeg) {
  const s = polarToXY(cx, cy, r, startDeg);
  const e = polarToXY(cx, cy, r, endDeg);
  const large = endDeg - startDeg > 180 ? 1 : 0;
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y}`;
}
function renderArc(pct) {
  const cx=80, cy=85, r=68;
  const startDeg=180, endDeg=360;
  const totalLen = Math.PI * r;
  const track = document.getElementById('arcTrack');
  const fill  = document.getElementById('arcFill');
  const pctEl = document.getElementById('arcPct');
  if (!track || !fill) return;
  const path = halfArcPath(cx, cy, r, startDeg, endDeg);
  track.setAttribute('d', path);
  fill.setAttribute('d', path);
  fill.style.strokeDasharray  = totalLen;
  fill.style.strokeDashoffset = totalLen - (totalLen * Math.min(1, pct));
  if (pctEl) pctEl.textContent = Math.round(pct * 100) + '%';
}

// ── Missions ─────────────────────────────────────────────────
function renderMissions() {
  if (!window.getHabits) { setTimeout(renderMissions, 50); return; }
  const habits = window.getHabits();
  const defaults = window.RPG_DEFAULT_SKILLS || {};
  const today = todayStr();

  // Collect habits from defaults
  const habitKeys = Object.keys(defaults).filter(k => defaults[k].isHabit && !defaults[k].private && defaults[k].active !== false);

  const container = document.getElementById('missionsCard');
  if (!container) return;
  if (!habitKeys.length) {
    container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">No habits set up yet — go to Settings.</div>';
    return;
  }

  let doneCount = 0;
  let xpToday = 0;
  const today2 = todayStr();

  // XP today from xpLog
  if (window.getCharacter) {
    const char = window.getCharacter();
    const log = char.xpLog || [];
    for (const entry of log) {
      if ((entry.date || '').startsWith(today2)) xpToday += Math.max(0, entry.amount || 0);
    }
  }

  container.innerHTML = habitKeys.map(k => {
    const def = defaults[k];
    const h = habits[k] || {};
    const donedToday = h.lastChecked === today;
    if (donedToday) doneCount++;
    const lvl = h.score || 0;
    return `<div class="mission-row${donedToday?' done':''}" onclick="toggleMission('${k}')" data-key="${k}">
      <div class="mission-check">
        <span class="mission-check-icon">✓</span>
      </div>
      <div class="mission-info">
        <div class="mission-name">${def.label}</div>
        <div class="mission-streak">${lvl >= 10 ? '👑 Level 10 — mastered' : lvl > 0 ? '⬆️ Level ' + lvl + '/10' : 'Level 0 — start today'}</div>
      </div>
      <div class="mission-xp">+15 XP</div>
    </div>`;
  }).join('');

  // Update arc
  const pct = habitKeys.length ? doneCount / habitKeys.length : 0;
  renderArc(pct);

  const arcXp = document.getElementById('arcXpToday');
  if (arcXp) arcXp.textContent = xpToday;

  // top habit level (0-10)
  let best = 0;
  for (const h of Object.values(habits)) { if ((h.score||0) > best) best = h.score; }
  const bs = document.getElementById('arcBestStreak');
  if (bs) bs.textContent = best + '/10';
}

window.toggleMission = function(key) {
  if (!window.checkHabit || !window.uncheckHabit) return;
  const defaults = window.RPG_DEFAULT_SKILLS || {};
  const def = defaults[key] || {};
  const habits = window.getHabits ? window.getHabits() : {};
  const h = habits[key] || {};
  const today = todayStr();
  const wasDone = h.lastChecked === today;

  if (wasDone) {
    window.uncheckHabit(key);
    if (window.addXP) window.addXP(key, -15, 'Habit unchecked: ' + def.label);
    showToast('Habit unchecked');
  } else {
    const result = window.checkHabit(key, def.label, def.icon);
    if (window.addXP) window.addXP(key, 15, 'Habit: ' + def.label);
    showToast('+15 XP · ' + def.label + ' · Level ' + (result.score||1) + '/10' + ((result.score||0) >= 10 ? ' 👑' : ''));
  }
  renderMissions();
  renderCharStrip();
};

// ── Focus skills ─────────────────────────────────────────────
let openFocusKey = null;

function getNextMilestone(def, currentLevel) {
  if (!def.milestones) return null;
  const levels = Object.keys(def.milestones).map(Number).sort((a,b)=>a-b);
  return levels.find(l => l > currentLevel) || null;
}
function getConfirmedMs(skillKey) {
  try { return JSON.parse(localStorage.getItem('rpg_milestones_v1')) || {}; } catch(e) { return {}; }
}

function renderFocusGrid() {
  const container = document.getElementById('focusGrid');
  if (!container) return;
  if (!window.getCharacter || !window.xpToLevel) { setTimeout(renderFocusGrid, 50); return; }

  const char = window.getCharacter();
  const skills = char.skills || {};
  const defaults = window.RPG_DEFAULT_SKILLS || {};
  const parents = window.RPG_PARENT_SKILLS || {};
  const domainMap = window.RPG_DOMAIN_MAP || {};

  // focus skills list
  let focusKeys = [];
  try { focusKeys = JSON.parse(localStorage.getItem('rpg_focus_skills_v1')) || []; } catch(e) {}

  if (!focusKeys.length) {
    // top 6 by XP, non-habit, active
    const active = Object.entries(defaults)
      .filter(([k,d]) => !d.isHabit && !d.private && d.active !== false)
      .map(([k,d]) => ({ key:k, xp: (skills[k]||{}).xp||0 }))
      .sort((a,b)=>b.xp-a.xp)
      .slice(0, 6);
    focusKeys = active.map(x=>x.key);
  }

  if (!focusKeys.length) {
    container.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:13px;grid-column:1/-1">Set focus skills in Settings.</div>';
    return;
  }

  container.innerHTML = focusKeys.map(key => {
    const def = defaults[key] || {};
    const s = skills[key] || {};
    const xp = s.xp || 0;
    const level = window.xpToLevel(xp);
    const rawPs = def.parentSkill || '';
    const ps = domainMap[rawPs] || rawPs;
    const parentDef = parents[ps] || {};
    const parentLabel = parentDef.label || ps;
    const nextMs = getNextMilestone(def, level);
    const nextMsText = nextMs ? `Lvl ${nextMs} — ${def.milestones[nextMs]}` : 'Max level reached';
    const nextXp = window.xpForLevel ? window.xpForLevel(level+1) : null;
    const thisXp = window.xpForLevel ? window.xpForLevel(level) : 0;
    const barPct = nextXp && nextXp !== Infinity
      ? Math.round(((xp - thisXp) / (nextXp - thisXp)) * 100)
      : 100;
    const isOpen = openFocusKey === key;

    // Build log buttons
    const logBtns = (def.quickLog || []).map(q =>
      `<button class="focus-log-btn" onclick="focusLog('${key}',${q.xp},'${(q.label||'').replace(/'/g,"\\'")}',event)">
        ${q.label}<span class="xp-tag">+${q.xp} XP</span>
       </button>`
    ).join('');

    // Build unlock ladder: last confirmed + next 3
    const confirmed = getConfirmedMs(key);
    const msLevels = def.milestones ? Object.keys(def.milestones).map(Number).sort((a,b)=>a-b) : [];
    const doneMs = msLevels.filter(l => l <= level);
    const lastDone = doneMs[doneMs.length-1];
    const upcomingMs = msLevels.filter(l => l > level).slice(0,3);
    const msRows = [
      ...(lastDone != null ? [`<div class="focus-ms-row"><span class="focus-ms-status">✅</span><span class="focus-ms-text done">Lvl ${lastDone} — ${def.milestones[lastDone]}</span></div>`] : []),
      ...upcomingMs.map((l,i) => `<div class="focus-ms-row"><span class="focus-ms-status">${i===0?'→':'·'}</span><span class="focus-ms-text${i===0?' next':''}">${i===0?'Next: ':''}Lvl ${l} — ${def.milestones[l]}</span></div>`)
    ].join('');

    return `<div class="focus-card${isOpen?' open':''}" id="fc-${key}" onclick="toggleFocusCard('${key}',event)">
      <div class="focus-card-top">
        <div class="focus-lvl-badge">${level}</div>
        <div>
          <div class="focus-name">${def.label || key}</div>
          <div class="focus-domain">${parentLabel}</div>
        </div>
      </div>
      <div class="focus-next">Next unlock · <strong>${nextMsText}</strong></div>
      <div class="focus-bar-track"><div class="focus-bar-fill" style="width:${barPct}%"></div></div>
      <div class="focus-expand">
        ${logBtns ? `<div class="focus-log-btns">${logBtns}</div>` : ''}
        ${msRows ? `<div class="focus-unlock-title">Unlock Path</div>${msRows}` : ''}
      </div>
    </div>`;
  }).join('');
}

window.toggleFocusCard = function(key, e) {
  // Don't close when clicking log buttons
  if (e && e.target && e.target.closest('.focus-log-btn')) return;
  openFocusKey = openFocusKey === key ? null : key;
  renderFocusGrid();
};

window.focusLog = function(key, xp, label, e) {
  if (e) e.stopPropagation();
  if (!window.addXP) return;
  window.addXP(key, xp, label);
  showToast('+' + xp + ' XP · ' + label);
  renderFocusGrid();
  renderCharStrip();
};

  const panel = document.createElement('div');
  panel.style.cssText = 'background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;';

  const logBtns = (def.quickLog || []).map(q =>
    `<button onclick="coreLog('${key}',${q.xp},'${(q.label||'').replace(/'/g,"\\'")}');this.closest('[data-overlay]').remove();"
      style="width:100%;padding:12px;margin-bottom:8px;border:1px solid #E8E6DF;border-radius:10px;background:#F4F3EF;font-size:14px;font-weight:600;text-align:left;cursor:pointer;font-family:inherit;">
      ${q.label} <span style="color:#D4633E;font-size:12px;float:right">+${q.xp} XP</span>
    </button>`
  ).join('');

  panel.innerHTML = `
    <div style="font-family:'Schibsted Grotesk',sans-serif;font-weight:800;font-size:18px;margin-bottom:4px">${def.label}</div>
    <div style="font-size:12px;color:#6F6C63;margin-bottom:16px">Level ${level} · ${xp} XP</div>

  `;
  overlay.setAttribute('data-overlay','1');
  overlay.appendChild(panel);
  overlay.addEventListener('click', e => { if (e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
};

window.coreLog = function(key, xp, label) {
  if (!window.addXP) return;
  window.addXP(key, xp, label);
  showToast('+' + xp + ' XP · ' + label);
  renderCoreTracker();
  renderCharStrip();
};

// ── Agenda ───────────────────────────────────────────────────
let agendaOffset = 0;        // 0 = today, -1 = yesterday, +1 = tomorrow
let armedPlan = null;        // {key,label,icon,type} waiting for a time slot
const AGENDA_PREFIX = 'rpg_agenda_v1:';   // + yyyy-mm-dd  ->  [{time, key, label, icon, type, done}]
const AGENDA_START_HOUR = 6;
const AGENDA_END_HOUR = 23;

function dateForOffset(off) {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + off);
  return d;
}
function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function loadAgenda(key) {
  try { return JSON.parse(localStorage.getItem(AGENDA_PREFIX + key)) || []; } catch(e) { return []; }
}
function saveAgenda(key, items) {
  try { localStorage.setItem(AGENDA_PREFIX + key, JSON.stringify(items)); } catch(e) {}
}
function renderAgendaDayLabel() {
  const d = dateForOffset(agendaOffset);
  const name = document.getElementById('agendaDayName');
  const sub = document.getElementById('agendaDaySub');
  const wrap = document.getElementById('agendaDayLabel');
  if (!name) return;
  if (agendaOffset === 0) { name.textContent = 'Today'; wrap.classList.add('is-today'); }
  else if (agendaOffset === -1) { name.textContent = 'Yesterday'; wrap.classList.remove('is-today'); }
  else if (agendaOffset === 1) { name.textContent = 'Tomorrow'; wrap.classList.remove('is-today'); }
  else { name.textContent = d.toLocaleDateString('en-GB',{weekday:'long'}); wrap.classList.remove('is-today'); }
  sub.textContent = d.toLocaleDateString('en-GB',{day:'numeric',month:'long'});
}
function renderAgenda() {
  renderAgendaDayLabel();
  const body = document.getElementById('agendaBody');
  if (!body) return;
  const key = dateKey(dateForOffset(agendaOffset));
  const items = loadAgenda(key);
  const nowHour = new Date().getHours();

  let html = '';
  for (let h = AGENDA_START_HOUR; h <= AGENDA_END_HOUR; h++) {
    const slotItems = items.filter(it => it.time === h);
    const blocks = slotItems.map((it, idx) => {
      const color = it.type === 'mission' ? 'var(--green)' : it.type === 'skill' ? 'var(--ember)' : 'var(--ink-card)';
      return `<div class="agenda-block${it.done?' done':''}" style="background:${color}" onclick="toggleAgendaBlock('${key}',${h},${idx},event)">
        <span class="agenda-block-icon">${it.icon||'•'}</span>
        <span class="agenda-block-text">${it.label}</span>
        <span class="agenda-block-x" onclick="removeAgendaBlock('${key}',${h},${idx},event)">×</span>
      </div>`;
    }).join('');
    const label = (h===12) ? '12 PM' : h>12 ? (h-12)+' PM' : h+' AM';
    html += `<div class="agenda-hour">
      <div class="agenda-hour-label">${label}</div>
      <div class="agenda-hour-slot" onclick="onSlotTap('${key}',${h})">${blocks}</div>
    </div>`;
  }
  body.innerHTML = html;

  // auto-scroll to current hour on today
  if (agendaOffset === 0) {
    const idx = Math.max(0, nowHour - AGENDA_START_HOUR);
    const row = body.children[idx];
    if (row) body.scrollTop = Math.max(0, row.offsetTop - 60);
  } else {
    body.scrollTop = 0;
  }
}
window.agendaShift = function(delta) {
  agendaOffset += delta;
  if (agendaOffset < -7) agendaOffset = -7;
  if (agendaOffset > 30) agendaOffset = 30;
  renderAgenda();
};
window.toggleAgendaBlock = function(key, hour, idx, e) {
  if (e) e.stopPropagation();
  if (e && e.target && e.target.classList.contains('agenda-block-x')) return;
  const items = loadAgenda(key);
  const matches = items.filter(it => it.time === hour);
  const it = matches[idx];
  if (!it) return;
  it.done = !it.done;
  saveAgenda(key, items);
  // award XP only when marking done today/past, for missions/skills
  if (it.done && it.key && window.addXP && agendaOffset <= 0) {
    if (it.type === 'mission' && window.checkHabit) {
      window.checkHabit(it.key, it.label, it.icon);
      window.addXP(it.key, 15, 'Agenda: ' + it.label);
      showToast('✓ ' + it.label + ' · +15 XP');
    } else if (it.type === 'skill') {
      window.addXP(it.key, 20, 'Agenda: ' + it.label);
      showToast('✓ ' + it.label + ' · +20 XP');
    } else {
      showToast('✓ ' + it.label);
    }
    renderMissions(); renderFocusGrid(); renderCharStrip();
  }
  renderAgenda();
};
window.removeAgendaBlock = function(key, hour, idx, e) {
  if (e) e.stopPropagation();
  const items = loadAgenda(key);
  let seen = -1;
  const filtered = items.filter(it => {
    if (it.time !== hour) return true;
    seen++;
    return seen !== idx;
  });
  saveAgenda(key, filtered);
  renderAgenda();
};

// Planner tray: chips you can arm, then tap a slot (or use the time picker)
function renderPlanTray() {
  const tray = document.getElementById('planTray');
  const chips = document.getElementById('planChips');
  if (!chips) return;
  const defaults = window.RPG_DEFAULT_SKILLS || {};

  // missions (habits not yet planned today is fine — chips are reusable)
  const missionKeys = Object.keys(defaults).filter(k => defaults[k].isHabit && !defaults[k].private && defaults[k].active !== false);
  // focus skills
  let focusKeys = [];
  try { focusKeys = JSON.parse(localStorage.getItem('rpg_focus_skills_v1')) || []; } catch(e) {}

  const chipData = [
    ...missionKeys.map(k => ({ key:k, label:defaults[k].label||k, icon:defaults[k].icon||'⚡', type:'mission' })),
    ...focusKeys.map(k => ({ key:k, label:(defaults[k]||{}).label||k, icon:(defaults[k]||{}).icon||'★', type:'skill' })),
  ];
  if (!chipData.length) { tray.style.display = 'none'; return; }
  tray.style.display = 'block';
  chips.innerHTML = chipData.map(c =>
    `<button class="plan-chip${armedPlan && armedPlan.key===c.key && armedPlan.type===c.type ? ' armed':''}"
      onclick='armPlan(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
      <span class="plan-chip-icon">${c.icon}</span>${c.label}
    </button>`
  ).join('');
}
window.armPlan = function(c) {
  if (armedPlan && armedPlan.key === c.key && armedPlan.type === c.type) {
    armedPlan = null; renderPlanTray(); return;
  }
  armedPlan = c;
  renderPlanTray();
  openTimePicker(c);
};
window.onSlotTap = function(key, hour) {
  if (!armedPlan) return;  // nothing armed → tapping an empty slot does nothing
  placeBlock(key, hour, armedPlan);
  armedPlan = null;
  renderPlanTray();
};
function placeBlock(key, hour, c) {
  const items = loadAgenda(key);
  items.push({ time: hour, key: c.key, label: c.label, icon: c.icon, type: c.type, done: false });
  saveAgenda(key, items);
  renderAgenda();
  showToast('Planned · ' + c.label);
}

// Time picker popover (tap a chip → choose a time directly)
function openTimePicker(c) {
  const key = dateKey(dateForOffset(agendaOffset));
  const bg = document.createElement('div');
  bg.className = 'timepick-bg';
  let slots = '';
  for (let h = AGENDA_START_HOUR; h <= AGENDA_END_HOUR; h++) {
    const label = (h===12) ? '12 PM' : h>12 ? (h-12)+' PM' : h+' AM';
    slots += `<button class="timepick-slot" data-h="${h}">${label}</button>`;
  }
  bg.innerHTML = `<div class="timepick">
    <div class="timepick-title">Schedule "${c.label}"</div>
    <div class="timepick-sub">Pick a time slot — or tap any slot in the agenda</div>
    <div class="timepick-grid">${slots}</div>
    <button class="timepick-cancel">Cancel</button>
  </div>`;
  bg.addEventListener('click', e => {
    if (e.target === bg || e.target.classList.contains('timepick-cancel')) { bg.remove(); return; }
    const slot = e.target.closest('.timepick-slot');
    if (slot) {
      placeBlock(key, parseInt(slot.dataset.h), c);
      armedPlan = null; renderPlanTray();
      bg.remove();
    }
  });
  document.body.appendChild(bg);
}

// ── Boot ─────────────────────────────────────────────────────
function boot() {
  renderGreeting();
  renderQuote();
  renderArc(0);
  renderMissions();
  renderFocusGrid();
  renderCoreTracker();
  renderCharStrip();
  renderAgenda();
  renderPlanTray();
}

// Wait for xp.js to initialise
if (window.getCharacter) {
  boot();
} else {
  document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 60));
}

// Sync
document.addEventListener('DOMContentLoaded', () => {
  if (typeof initCloudSync === 'function' && window.supabase) {
    initCloudSync({
      appKey: 'rpg',
      syncedKeys: ['rpg_character_v1','rpg_habits_v1','rpg_milestones_v1','rpg_quotes_v1','rpg_pin_v1','rpg_active_quests_v1','rpg_focus_skills_v1'],
      syncedPrefixes: ['rpg_daily_v1:','rpg_agenda_v1:']
    });
  }
});
</script>
