<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ef">
  <title>Gamenfy Privé herstellen</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;background:#f4f3ef;color:#15140f}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,420px);background:#fff;border:1px solid #e8e6df;border-radius:22px;padding:26px;box-shadow:0 18px 60px rgba(21,20,15,.12)}.mark{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#d4633e;margin-bottom:10px}h1{font-size:25px;line-height:1.15;margin:0 0 8px}p{font-size:14px;line-height:1.5;color:#6f6c63;margin:0}.ok{color:#2e8b5f;font-weight:750;margin-top:12px;font-size:12px}
  </style>
</head>
<body>
  <div class="wrap"><div class="card"><div class="mark">Gamenfy · privé</div><h1>Privé-login wordt hersteld…</h1><p id="msg">Ik verwijder alleen de oude gedeelde browsersessie. Je Gamenfy-data blijft onaangeraakt.</p><div id="status" class="ok">Bezig…</div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (async function(){
    const ref='ttxjsoahmtennnufgeqx';
    const url='https://'+ref+'.supabase.co';
    const key='sb_publishable_5lYXJme36ggS2dWTJbMSCA_Ir9Uogab';
    try{
      const client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:false,detectSessionInUrl:false}});
      try{await client.auth.signOut({scope:'local'});}catch(_e){}
      try{localStorage.removeItem('sb-'+ref+'-auth-token');}catch(_e){}
      document.getElementById('status').textContent='Klaar. Je gaat nu naar Gamenfy Privé.';
    }catch(_e){
      try{localStorage.removeItem('sb-'+ref+'-auth-token');}catch(__e){}
      document.getElementById('status').textContent='Sessierest uitgevoerd. Je gaat nu terug.';
    }
    setTimeout(function(){location.replace('/?private-login-reset=1');},650);
  })();
  </script>
</body>
</html>
