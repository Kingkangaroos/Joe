<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1020"><title>3D Review · Gamenfy Lab</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0b1020;--ink:#f7f8ff;--muted:#aeb7d1;--line:rgba(255,255,255,.1);--lav:#c9bcff;--mint:#8be1c1;--red:#ff9c9c;--display:'Schibsted Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#26346c 0,#0b1020 38%,#070914 86%);color:var(--ink);font-family:var(--body);min-height:100svh}.shell{max-width:860px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 90px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.back{text-decoration:none;font-weight:800;font-size:12px}.tag{padding:7px 10px;border-radius:999px;border:1px solid #365a51;background:#102721;color:#98e6ce;font-size:9px;font-weight:900;letter-spacing:.08em}.eyebrow{display:block;margin-top:28px;color:var(--mint);font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:8px 0 12px;font:800 clamp(40px,8vw,72px)/.92 var(--display);letter-spacing:-.06em}.lead{max-width:720px;color:var(--muted);font-size:13px;line-height:1.6}.grid{display:grid;gap:9px;margin-top:18px}.card{padding:13px;border:1px solid var(--line);border-radius:17px;background:rgba(18,24,48,.86)}.head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#c9bcff;color:#211b38;font:900 12px var(--display)}.title strong{display:block;font:800 14px var(--display)}.title small{display:block;margin-top:2px;color:var(--muted);font-size:9px}.open{font-size:10px;font-weight:900;text-decoration:none}.choices{display:flex;gap:5px;margin-top:10px}.choices button{flex:1;border:1px solid var(--line);background:#11172d;border-radius:11px;padding:8px 6px;color:#dce4ff;font-weight:900;font-size:9px;cursor:pointer}.choices button[data-choice="yes"].on{background:#15382e;border-color:#3e806c;color:#9df0d2}.choices button[data-choice="maybe"].on{background:#3c311c;border-color:#796033;color:#f0d396}.choices button[data-choice="no"].on{background:#3a2026;border-color:#70404b;color:#ffb4bf}.card textarea{width:100%;min-height:58px;margin-top:7px;border:1px solid var(--line);border-radius:11px;background:#090e20;color:#eef3ff;padding:9px;font:11px/1.45 var(--body);resize:vertical}.bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;display:flex;gap:7px;margin-top:18px;padding:8px;border:1px solid var(--line);border-radius:16px;background:rgba(8,11,23,.9);backdrop-filter:blur(14px)}.bar button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:900;font-size:10px;cursor:pointer}.copy{background:#8be1c1;color:#10221c}.reset{background:#1a2038;color:#c6cde1}.summary{margin-top:12px;padding:11px;border:1px solid var(--line);border-radius:14px;background:#0d1328;color:#aeb7d1;font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;display:none}.toast{position:fixed;left:50%;top:12%;transform:translate(-50%,8px);opacity:0;z-index:30;background:#f4f5ff;color:#181a2c;padding:10px 14px;border-radius:999px;font-size:10px;font-weight:900;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><main class="shell"><div class="top"><a class="back" href="lab.html">‹ ChatGPT Lab</a><span class="tag">SNELLE REVIEW · LOKAAL BEWAARD</span></div><span class="eyebrow">VANAVOND · 10 TESTS</span><h1>Je hoeft alleen te voelen wat werkt.</h1><p class="lead">Open een test, tik daarna <b>Ja</b>, <b>Misschien</b> of <b>Nee</b> en zet desnoods één korte notitie. Alles blijft alleen op dit apparaat totdat je op <b>Kopieer feedback</b> drukt en het hier in de chat plakt.</p><div id="grid" class="grid"></div><div id="summary" class="summary"></div><div class="bar"><button id="copy" class="copy">Kopieer feedback</button><button id="reset" class="reset">Wis review</button></div></main><div id="toast" class="toast"></div><script>
const KEY='gamenfy_3d_review_v1';
const tests=[
[1,'Rig Purist','beweegt het skelet zelf?'],[2,'Home Hero','3D als Home-character'],[3,'Side Runner','echte root locomotion'],[4,'Living Park','presence zonder input'],[5,'Mission Interaction','missie wordt wereldactie'],[6,'Grounded Walk QA','foot contact / glijden'],[7,'2.5D Toon Fit','3D past visueel bij Gamenfy'],[8,'Reactive Home','UI stuurt character'],[9,'iPhone Performance','haalbaarheid op mobiel'],[10,'Living Home Synthesis','minimale levende Home-hypothese']
];
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}
const grid=document.getElementById('grid'),summary=document.getElementById('summary'),toast=document.getElementById('toast');
const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function render(){
 grid.innerHTML=tests.map(([n,name,why])=>{const s=state[n]||{};return '<section class="card" data-test="'+n+'"><div class="head"><span class="num">'+n+'</span><span class="title"><strong>'+esc(name)+'</strong><small>'+esc(why)+'</small></span><a class="open" href="lab-3d-test-'+n+'.html">Open →</a></div><div class="choices"><button data-choice="yes" class="'+(s.choice==='yes'?'on':'')+'">✓ Ja</button><button data-choice="maybe" class="'+(s.choice==='maybe'?'on':'')+'">~ Misschien</button><button data-choice="no" class="'+(s.choice==='no'?'on':'')+'">× Nee</button></div><textarea placeholder="Korte indruk…">'+esc(s.note||'')+'</textarea></section>'}).join('');
 grid.querySelectorAll('.card').forEach(card=>{
   const n=card.dataset.test;
   card.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state[n]=state[n]||{};state[n].choice=b.dataset.choice;save();render()});
   card.querySelector('textarea').oninput=e=>{state[n]=state[n]||{};state[n].note=e.target.value;save()};
 });
}
function buildSummary(){
 const map={yes:'JA',maybe:'MISSCHIEN',no:'NEE'};
 return ['GAMENFY 3D REVIEW'].concat(tests.map(([n,name])=>{const s=state[n]||{};return 'Test '+n+' · '+name+': '+(map[s.choice]||'—')+(s.note?' — '+s.note.trim():'')})).join('\n');
}
document.getElementById('copy').onclick=async()=>{const txt=buildSummary();summary.textContent=txt;summary.style.display='block';try{await navigator.clipboard.writeText(txt);toast.textContent='Feedback gekopieerd';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}catch{toast.textContent='Selecteer de tekst hieronder';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}};
document.getElementById('reset').onclick=()=>{if(!confirm('Lokale 3D-review wissen?'))return;state={};save();summary.style.display='none';render()};
render();
</script></body></html>
