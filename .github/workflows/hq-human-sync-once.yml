name: ChatGPT one-time human HQ sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-and-remove-self:
    if: ${{ !contains(github.event.head_commit.message, '[hq-human-synced]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync human Project HQ to shipped WHY state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('PROJECT-HQ.md')
          s=p.read_text()

          s=s.replace(
            "4. **WHY-chain model** — design the durable link `action / skill -> intermediate reason -> concrete life goal / direction`, so Gamenfy and Jarvis can explain why today's move matters.",
            "4. **WHY layer verification + linking** — the goal-first foundation is shipped. Verify it against Joey's real active Goals and add `linkedSkills` only where Joey genuinely intends a connection; do not infer a competing taxonomy."
          )

          marker="- [x] Full guarded browserless smoke suite passed on the actual product patch in workflow run `33979142333` before the product commit was created."
          addition=marker+"\n- [x] **Goal-first WHY foundation shipped**: active `rpg_goals_v1` Goals can drive the Home reminder and Daily Challenge context through explicit `linkedSkills`.\n- [x] `character.html#goals` now opens the canonical Goals view on initial load and hash changes; regression coverage added.\n- [x] WHY release merged to `main` as `849c119f481f53c0dd477ddad80d96a00e2263b0`; production deployment `dpl_3hUiKkptRddroLxnjBeyT7Un2LxR` verified READY."
          if marker in s and "Goal-first WHY foundation shipped" not in s:
            s=s.replace(marker,addition,1)

          s=s.replace(
            "- [ ] WHY-chain data model + UI.",
            "- [ ] Verify the shipped goal-first WHY layer with Joey's real active Goals; add explicit `linkedSkills` and extend beyond Home/Daily Challenge only where useful."
          )

          old="### WHY graph\n- Gamenfy should show why an action matters, e.g. `20 min Dance -> Social confidence -> easier dating/going out -> Love / Happiness direction`.\n- Existing 100-year categories do not have to remain the final app-navigation taxonomy. Preserve the essence of the goals, not old labels for their own sake.\n- Jarvis should eventually reason from this graph so advice reflects real priorities and trade-offs rather than generic motivation."
          new="### WHY graph\n- **Foundation shipped:** active unfinished Goals in `rpg_goals_v1` are the primary WHY source. Skill-to-goal links are explicit through `linkedSkills`; Gamenfy must not silently invent links or a competing life taxonomy.\n- Home can surface a compact priority-goal reminder; Daily Challenge can show `WHY → <goal>` when its selected skill is explicitly linked.\n- The canonical Goals deep-link is `character.html#goals`.\n- Next: validate Joey's real links, then extend the graph toward actions/seasons/tasks and eventually Jarvis reasoning so advice reflects real priorities and trade-offs rather than generic motivation.\n- Existing 100-year categories do not have to remain the final app-navigation taxonomy. Preserve the essence of the goals, not old labels for their own sake."
          if old in s:
            s=s.replace(old,new,1)

          changelog="""\n### 2026-09-05 — goal-first WHY release\n- Recovered the unfinished WHY pass from PR #22 after chat loading became unreliable.\n- Active unfinished Goals (`rpg_goals_v1`) are now the primary reminder source; skill links require explicit `linkedSkills`.\n- Home receives a compact goal-first WHY reminder and Daily Challenge can display the linked goal.\n- Found and fixed an integration bug before merge: `character.html#goals` previously did not route to the Goals view.\n- Full browserless regression suite passed with the deep-link guard.\n- PR #22 squash-merged to `main` as `849c119f481f53c0dd477ddad80d96a00e2263b0`.\n- Vercel production deployment `dpl_3hUiKkptRddroLxnjBeyT7Un2LxR` verified `READY`.\n"""
          anchor="## HUMAN CHANGELOG\n"
          if "### 2026-09-05 — goal-first WHY release" not in s:
            s=s.replace(anchor,anchor+changelog+"\n",1)

          p.write_text(s)
          PY

      - name: Remove this one-time workflow
        shell: bash
        run: git rm .github/workflows/hq-human-sync-once.yml

      - name: Commit synced HQ
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: sync human HQ after WHY release [hq-human-synced]"
          git push origin HEAD:main
