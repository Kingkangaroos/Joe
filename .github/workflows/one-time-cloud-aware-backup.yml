name: One-time cloud-aware backup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/one-time-cloud-aware-backup.py'
      - '.github/workflows/one-time-cloud-aware-backup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Replace local-only backup with owner-cloud backup
        run: python scripts/one-time-cloud-aware-backup.py
      - name: Commit exact fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT (OpenAI)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add character.html tests/cloud-backup-smoke.js
          git rm scripts/one-time-cloud-aware-backup.py .github/workflows/one-time-cloud-aware-backup.yml
          git commit -m 'ChatGPT: make backup owner-cloud aware'
          git push origin HEAD:main
