name: ChatGPT one-shot canonical habit engine patch

on:
  push:
    branches:
      - chatgpt/habit-engine-canonical-replay

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/habit-engine-canonical-replay
          fetch-depth: 0

      - name: Patch canonical habit engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          xp = Path('xp.js')
          s = xp.read_text()

          old_final = """    if (lastChecked !== null) {
                const finalMissed = Math.max(0, daysBetween(lastChecked, today) - 1);
                score = Math.max(0, score - finalMissed);
              }
          """
          new_final = """    if (lastChecked !== null) {
                const finalMissed = Math.max(0, daysBetween(lastChecked, today) - 1);
                score = Math.max(0, score - finalMissed);
                // The current streak ends once a completed calendar day after the
                // latest check was missed. Score can remain above zero; streak cannot.
                if (finalMissed > 0) streak = 0;
              }
          """
          if s.count(old_final) != 1:
              raise SystemExit(f'expected one final-missed target, found {s.count(old_final)}')
          s = s.replace(old_final, new_final)

          s = s.replace(
              "time (+1 per check capped at 10, -1 per missed day with a one-day grace\n  // — the miss only shows up the day AFTER, never the day of). Replaying",
              "time (+1 per check capped at 10, -1 per completed missed calendar day\n  // — today's mission is not treated as missed until the day has ended). Replaying"
          )

          old_line = "        if (window.checkHabitFor) window.checkHabitFor(p.key, date, d.label, d.icon);"
          new_lines = """        if (window.checkHabitFor) window.checkHabitFor(p.key, date, d.label, d.icon);
                // Habitlog is authoritative. Jarvis can backdate a check, so replay the
                // full log just like Main/Skills/Fitbit instead of leaving incremental
                // score/streak state that depends on mutation order.
                if (window.recomputeHabitFromLog) window.recomputeHabitFromLog(p.key);"""
          if s.count(old_line) != 1:
              raise SystemExit(f'expected one Jarvis checkHabit line, found {s.count(old_line)}')
          s = s.replace(old_line, new_lines)
          xp.write_text(s)

          top = Path('topbar.js')
          t = top.read_text()
          marker = "\n// v11.3 — cross-page consistency guard for the authoritative habit replay."
          if marker not in t:
              raise SystemExit('topbar guard marker not found')
          t = t.split(marker, 1)[0].rstrip() + '\n'
          top.write_text(t)
          PY

      - name: Syntax and regression source checks
        run: |
          node --check xp.js
          node --check topbar.js
          python3 - <<'PY'
          from pathlib import Path
          x = Path('xp.js').read_text()
          t = Path('topbar.js').read_text()
          assert 'if (finalMissed > 0) streak = 0;' in x
          assert 'if (window.recomputeHabitFromLog) window.recomputeHabitFromLog(p.key);' in x
          assert '__gamenfyStreakGuard' not in t
          print('PASS source invariants')
          PY
          git diff --check

      - name: Self-clean and commit engine changes only
        run: |
          rm .github/workflows/chatgpt-habit-engine-one-shot.yml
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: canonicalize habit replay for misses and Jarvis"
          git push origin HEAD:chatgpt/habit-engine-canonical-replay
