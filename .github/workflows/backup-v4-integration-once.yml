name: Backup v4 integration once

on:
  push:
    branches:
      - chatgpt/backup-v4-restore-generation

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/backup-v4-restore-generation

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Normalize generated safety contract/tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/backup_v4_patch.py')
          s=p.read_text(encoding='utf-8')
          old="assert.deepEqual(V.compareOwnerFingerprint(v4,fp),{verified:true,match:true,reason:'same-account'});"
          new="const ownerMatch=V.compareOwnerFingerprint(v4,fp);\\nassert.equal(ownerMatch.verified,true);\\nassert.equal(ownerMatch.match,true);\\nassert.equal(ownerMatch.reason,'same-account');"
          if old not in s:
              raise SystemExit('validator assertion target missing')
          s=s.replace(old,new,1)
          required={
            '### A. Authenticated owner match':'### A. Owner/auth proof — authenticated owner match',
            '### G. Atomic cloud-first restore generation':'### G. Cloud convergence protection — atomic cloud-first restore generation',
            '**Do not ship Phase 2 until executable regression coverage proves stale cloud or offline device state cannot resurrect pre-restore data.**':'**Do not ship Phase 2 until executable regression coverage proves stale cloud state cannot resurrect pre-restore data, including from offline devices.**'
          }
          for a,b in required.items():
              if a not in s:
                  raise SystemExit(f'safety phrase target missing: {a}')
              s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Apply guarded v4 patch
        run: python .github/scripts/backup_v4_patch.py

      - name: Run complete browserless regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

      - name: Remove one-time integration files
        run: |
          rm .github/scripts/backup_v4_patch.py
          rm .github/workflows/backup-v4-integration-once.yml

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: integrate backup v4 owner binding [restore-v4-guarded]"
          git push origin HEAD:chatgpt/backup-v4-restore-generation
