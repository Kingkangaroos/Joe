name: One-time PIN privacy copy fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-pin-copy-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch PIN privacy copy
        run: python3 tools/one-time-pin-copy-fix.py
      - name: Commit exact fix and remove helpers
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-pin-copy-fix.yml tools/one-time-pin-copy-fix.py
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.html .github/workflows/one-time-pin-copy-fix.yml tools/one-time-pin-copy-fix.py
          git commit -m "ChatGPT: clarify PIN is a UI privacy lock"
          git push origin HEAD:main
