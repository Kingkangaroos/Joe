name: ChatGPT compact HQ device WHY sync
on:
  push:
    branches: [chatgpt/hq-device-why-sync]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HQ branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/hq-device-why-sync
          fetch-depth: 0
      - name: Apply durable HQ patch
        run: python .hq-sync-20260906.py
      - name: Run complete browserless regression suite
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove temporary sync files
        run: rm .hq-sync-20260906.py .github/workflows/hq-device-why-sync-small-once.yml
      - name: Commit durable HQ sync
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: sync HQ after device and WHY audits [hq-device-why-synced]"
          git push origin HEAD:chatgpt/hq-device-why-sync
