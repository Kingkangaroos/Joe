name: HQ follow-up sync
on:
  push:
    branches:
      - chatgpt/hq-followup-sept6
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/hq-followup-sept6
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply HQ sync
        run: python3 scripts/hq-followup-sept6.py
      - name: Validate HQ state
        run: |
          python3 -m json.tool PROJECT-HQ-STATE.json >/dev/null
          node tests/visible-product-followup-smoke.js
      - name: Remove one-shot files
        run: |
          rm scripts/hq-followup-sept6.py
          rm .github/workflows/hq-followup-sept6.yml
      - name: Commit durable HQ sync
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: sync HQ after Joey follow-up release"
          git push origin HEAD:chatgpt/hq-followup-sept6
