name: One-time secure Settings cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-secure-settings-cleanup.yml'

permissions:
  contents: write

jobs:
  patch-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove embedded Hevy credential default
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('settings.html')
          text = p.read_text(encoding='utf-8')
          original = text

          # Never carry a recognizable credential prefix in the UI placeholder.
          text = re.sub(
              r'(id="hevyKeyInput"\s*\n\s*)placeholder="[^"]*"',
              r'\1placeholder="Paste your Hevy API key"',
              text,
              count=1,
          )

          # Remove the old boot-time fallback that wrote a literal credential
          # into localStorage when a device had no Hevy key yet. Existing device
          # values are intentionally preserved; rotation is a separate action.
          text, count = re.subn(
              r"\n\s*// Pre-fill Hevy key\s*\n\s*if \(!localStorage\.getItem\(HEVY_KEY\)\) \{\s*\n\s*localStorage\.setItem\(HEVY_KEY,\s*'[^']+'\);\s*\n\s*\}\s*\n",
              "\n  // Existing device Hevy key, if configured manually. No embedded fallback.\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected exactly one embedded Hevy fallback block')
          if text == original:
              raise SystemExit('No Settings changes produced')
          p.write_text(text, encoding='utf-8')

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-secure-settings-cleanup.yml
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.html .github/workflows/one-time-secure-settings-cleanup.yml
          git commit -m "ChatGPT: remove embedded Hevy credential from Settings"
          git push origin HEAD:main
