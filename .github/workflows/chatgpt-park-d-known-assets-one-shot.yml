name: ChatGPT one-shot Park D known evolution asset fix

on:
  push:
    branches: [chatgpt/daily-missions-park-d]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/daily-missions-park-d
          fetch-depth: 0
      - name: Stop probing nonexistent Park D evolution files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('park2.js'); s=p.read_text()
          marker="  var root, stage, agentsEl, rosterEl, detailEl, gardenEl, motionButton;"
          if marker not in s: raise SystemExit('park2 marker missing')
          known="""  // Only request evolution files that physically exist. This avoids a 404\n  // probe on every missing starter/apprentice/expert asset. Expert currently\n  // reuses the real advanced form for the three companions that have it.\n  var KNOWN_EVOLUTION_ART={\n    sleep:{advanced:'img/lab/park2/sleep/advanced.png',expert:'img/lab/park2/sleep/advanced.png',mastery:'img/lab/park2/sleep/mastery.png'},\n    walking:{advanced:'img/lab/park2/walking/advanced.png',expert:'img/lab/park2/walking/advanced.png',mastery:'img/lab/park2/walking/mastery.png'},\n    meditation:{advanced:'img/lab/park2/meditation/advanced.png',expert:'img/lab/park2/meditation/advanced.png',mastery:'img/lab/park2/meditation/mastery.png'}\n  };\n\n"""
          s=s.replace(marker,known+marker,1)
          old="""  function loadEvolutionImage(img,config,evolution,owner) {\n    var candidate='img/lab/park2/'+(config.assetKey||config.key)+'/'+evolution.stage.key+'.png';\n    var probe=new Image();\n    probe.onload=function(){\n      setCharacterArt(owner,candidate);img.dataset.evolutionAsset='true';\n      if (owner) owner.classList.add('has-evolution-art');\n    };\n    probe.onerror=function(){\n      img.dataset.evolutionAsset='fallback';\n      if (owner) owner.classList.add('uses-evolution-fallback');\n    };\n    probe.src=candidate;\n  }\n"""
          new="""  function loadEvolutionImage(img,config,evolution,owner) {\n    var known=KNOWN_EVOLUTION_ART[config.assetKey||config.key]||{};\n    var candidate=known[evolution.stage.key];\n    if(!candidate){\n      img.dataset.evolutionAsset='fallback';\n      if(owner) owner.classList.add('uses-evolution-fallback');\n      return;\n    }\n    setCharacterArt(owner,candidate);\n    img.dataset.evolutionAsset='true';\n    if(owner) owner.classList.add('has-evolution-art');\n  }\n"""
          if s.count(old)!=1: raise SystemExit(f'loader target count={s.count(old)}')
          s=s.replace(old,new,1); p.write_text(s)
          PY
      - name: Syntax check
        run: |
          node --check park2.js
          grep -q "KNOWN_EVOLUTION_ART" park2.js
          ! grep -q "var probe=new Image" park2.js
      - name: Self-clean and commit
        run: |
          rm .github/workflows/chatgpt-park-d-known-assets-one-shot.yml
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add park2.js .github/workflows/chatgpt-park-d-known-assets-one-shot.yml
          git commit -m "ChatGPT: stop probing missing Park D evolution assets"
          git push origin HEAD:chatgpt/daily-missions-park-d
