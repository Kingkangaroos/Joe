name: ChatGPT compact Device QA canonical state
on:
  push:
    branches: [chatgpt/device-qa-canonical-state]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/device-qa-canonical-state
          fetch-depth: 0
      - name: Apply Device QA patch
        run: python .device-qa-canonical-patch.py
      - name: Run complete browserless regression suite
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove temporary patch files
        run: rm .device-qa-canonical-patch.py .github/workflows/device-qa-canonical-state-small-once.yml
      - name: Commit verified QA extension
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: add canonical local-state proof to Device QA [device-qa-canonical-state]"
          git push origin HEAD:chatgpt/device-qa-canonical-state
