name: Quick Water CAS integration

on:
  push:
    branches:
      - chatgpt/topbar-health-cas

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/topbar-health-cas
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply guarded Quick Water patch
        run: python3 scripts/topbar-health-cas-patch.py
      - name: Run all smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove one-shot integration files
        run: |
          rm scripts/topbar-health-cas-patch.py
          rm .github/workflows/topbar-health-cas-integration.yml
      - name: Commit proven integration
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: move Quick Water behind Health CAS gate"
          git push origin HEAD:chatgpt/topbar-health-cas
