name: Backup generation overlay guard

on:
  push:
    branches: [chatgpt/backup-generation-overlay-guard]

permissions:
  contents: write

concurrency:
  group: backup-generation-overlay-guard
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/backup-generation-overlay-guard
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply exact generation-overlay patch
        run: python3 .github/scripts/patch-backup-generation-overlay.py

      - name: Run complete browserless regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

      - name: Remove one-shot integration machinery
        run: |
          rm .github/scripts/patch-backup-generation-overlay.py
          rm .github/workflows/backup-generation-overlay-guard.yml

      - name: Commit proven runtime patch and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character.html tests/cloud-backup-smoke.js .github/scripts/patch-backup-generation-overlay.py .github/workflows/backup-generation-overlay-guard.yml
          git commit -m "fix: keep backups within restore generation"
          git push origin HEAD:chatgpt/backup-generation-overlay-guard
