name: Website Ventures port after follow-up
on:
  push:
    branches:
      - chatgpt/website-ventures-port-after-followup
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/website-ventures-port-after-followup
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch superseded Website Ventures branch
        run: git fetch origin chatgpt/website-ventures-hq-visual-plan:refs/remotes/origin/chatgpt/website-ventures-hq-visual-plan
      - name: Port durable Website Ventures work into current shell
        run: |
          python3 scripts/port-website-ventures-after-followup.py
          sed -i "/Grip.*false || true/d" tests/website-ventures-hq-port-smoke.js
      - name: Validate state and full regression suite
        run: |
          python3 -m json.tool WEBSITE-VENTURES-HQ-STATE.json >/dev/null
          set -euo pipefail
          for test in tests/*-smoke.js; do node "$test"; done
      - name: Remove one-shot files
        run: |
          rm scripts/port-website-ventures-after-followup.py
          rm .github/workflows/website-ventures-port-after-followup.yml
      - name: Commit proven port
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "venture: port rich Website HQ into current Ventures shell"
          git push origin HEAD:chatgpt/website-ventures-port-after-followup
