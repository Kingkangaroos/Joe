name: One-time non-health safety fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-nonhealth-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Settings and Finance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s = Path('settings.html')
          text = s.read_text(encoding='utf-8')
          replacements = [
            ('Workspace (v10.55)', 'Workspace · not active yet'),
            ('For a friend trying Gamenfy: give their device its own workspace name so their data stays completely separate from yours — same app, same Supabase project, different data entirely.',
             'Separate cloud workspaces are not enabled yet. Signed-in devices currently use the same owner-scoped Gamenfy cloud rows; do not use this for friend/test-user isolation.'),
            ('id="wsNameInput" placeholder="e.g. alex, sam..." maxlength="24"',
             'id="wsNameInput" placeholder="Workspace isolation unavailable" maxlength="24" disabled'),
            ('<button class="assess-btn" style="margin:0;padding:9px 16px;white-space:nowrap" onclick="saveWorkspace()"><span>Set</span></button>',
             '<button class="assess-btn" style="margin:0;padding:9px 16px;white-space:nowrap;opacity:.55" type="button" disabled><span>Set</span></button>'),
            ("label.textContent = current ? ('\"'+current+'\" workspace') : \"Joey's main workspace\";",
             "label.textContent = 'Single owner workspace';"),
            ('if(window.setGamenfyWorkspaceId) window.setGamenfyWorkspaceId(newVal);',
             "alert('Separate cloud workspaces are not active yet.'); return false;")
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit('Settings patch anchor count != 1: ' + old[:60])
            text = text.replace(old, new, 1)
          s.write_text(text, encoding='utf-8')

          f = Path('finance.html')
          fin = f.read_text(encoding='utf-8')
          old = "syncedKeys: ['subs', 'wishlist', 'nw_currency', 'nw:activity', 'nw:history'],"
          new = "syncedKeys: ['subs', 'wishlist', 'vk_paid_v1', 'nw_currency', 'nw:activity', 'nw:history'],"
          if fin.count(old) != 1:
            raise SystemExit('Finance sync anchor count != 1')
          fin = fin.replace(old, new, 1)
          f.write_text(fin, encoding='utf-8')
          PY
      - name: Commit exact fixes and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-nonhealth-cleanup.yml
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.html finance.html .github/workflows/one-time-nonhealth-cleanup.yml
          git commit -m "ChatGPT: secure workspace UI and finance payment sync"
          git push origin HEAD:main
