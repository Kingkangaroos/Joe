name: One-time Body weight sync fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-body-weight-sync-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch RPG sync scope
        run: python3 tools/one-time-body-weight-sync-fix.py
      - name: Commit exact fix and remove helpers
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-body-weight-sync-fix.yml tools/one-time-body-weight-sync-fix.py
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xp.js .github/workflows/one-time-body-weight-sync-fix.yml tools/one-time-body-weight-sync-fix.py
          git commit -m "ChatGPT: sync manual Body weight history"
          git push origin HEAD:main
# retry after exact compact-array anchor audit
