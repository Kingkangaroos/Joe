name: HQ owner generation production proof

on:
  push:
    branches: [chatgpt/hq-owner-generation-production-proof]

permissions:
  contents: write

concurrency:
  group: hq-owner-generation-production-proof
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/hq-owner-generation-production-proof
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply exact HQ proof sync
        run: python3 .github/scripts/patch-hq-owner-generation-proof.py

      - name: Validate machine HQ JSON
        run: python3 -m json.tool PROJECT-HQ-STATE.json >/dev/null

      - name: Run complete browserless regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

      - name: Remove one-shot integration machinery
        run: |
          rm .github/scripts/patch-hq-owner-generation-proof.py
          rm .github/workflows/hq-owner-generation-production-proof.yml

      - name: Commit proven durable handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-HQ-STATE.json PROJECT-HQ.md BUGS-ACTIVE.md .github/scripts/patch-hq-owner-generation-proof.py .github/workflows/hq-owner-generation-production-proof.yml
          git commit -m "docs: sync owner generation production proof"
          git push origin HEAD:chatgpt/hq-owner-generation-production-proof
