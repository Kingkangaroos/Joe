name: Sync cache pin audit
on:
  push:
    branches:
      - chatgpt/sync-cache-pin-audit
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/sync-cache-pin-audit
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Align active top-level sync consumers
        run: |
          python3 scripts/sync-cache-pin-audit.py
          python3 scripts/sync-cache-pin-test-adapter.py
      - name: Full regression suite
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do node "$test"; done
      - name: Remove one-shot files
        run: |
          rm scripts/sync-cache-pin-audit.py
          rm scripts/sync-cache-pin-test-adapter.py
          rm .github/workflows/sync-cache-pin-audit.yml
      - name: Commit proven cache-key alignment
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align active pages to sync.js v11.9 cache key"
          git push origin HEAD:chatgpt/sync-cache-pin-audit
