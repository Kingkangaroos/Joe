name: One-time backup scope fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-backup-scope-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch backup export scope
        run: python3 tools/one-time-backup-scope-fix.py
      - name: Commit exact fix and remove helpers
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-backup-scope-fix.yml tools/one-time-backup-scope-fix.py
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add character.html .github/workflows/one-time-backup-scope-fix.yml tools/one-time-backup-scope-fix.py
          git commit -m "ChatGPT: make backup complete and credential-free"
          git push origin HEAD:main
