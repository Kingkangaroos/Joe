name: One-time Goals overdue retention

on:
  push:
    branches: [main]
    paths:
      - 'scripts/one-time-goals-overdue-retention.py'
      - '.github/workflows/one-time-goals-overdue-retention.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Goals overdue behavior
        run: python scripts/one-time-goals-overdue-retention.py
      - name: Commit exact fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT (OpenAI)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add character.html tests/goals-overdue-retention-smoke.js
          git rm scripts/one-time-goals-overdue-retention.py .github/workflows/one-time-goals-overdue-retention.yml
          git commit -m 'ChatGPT: keep overdue Goals visible until deliberately closed'
          git push origin HEAD:main
