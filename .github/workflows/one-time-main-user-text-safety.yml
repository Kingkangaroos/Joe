name: One-time Main user text safety

on:
  push:
    branches: [main]
    paths:
      - 'scripts/one-time-main-user-text-safety.py'
      - '.github/workflows/one-time-main-user-text-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Escape synced free text on Main
        run: python scripts/one-time-main-user-text-safety.py
      - name: Commit exact fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT (OpenAI)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/main-user-text-safety-smoke.js
          git rm scripts/one-time-main-user-text-safety.py .github/workflows/one-time-main-user-text-safety.yml
          git commit -m 'ChatGPT: render synced Main free text safely'
          git push origin HEAD:main
