name: HQ backup v4 sync once

on:
  push:
    branches:
      - chatgpt/hq-backup-v4-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/hq-backup-v4-sync

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Patch durable handoff
        run: python .github/scripts/hq_backup_v4_sync.py

      - name: Validate JSON state
        run: python -m json.tool PROJECT-HQ-STATE.json >/dev/null

      - name: Run complete browserless regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do node "$test"; done

      - name: Remove one-time files
        run: |
          rm .github/scripts/hq_backup_v4_sync.py
          rm .github/workflows/hq-backup-v4-sync-once.yml

      - name: Commit durable handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: sync HQ after backup v4 release [hq-backup-v4-synced]"
          git push origin HEAD:chatgpt/hq-backup-v4-sync
