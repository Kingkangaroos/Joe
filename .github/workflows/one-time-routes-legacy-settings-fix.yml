name: One-time Routes sync and legacy Settings cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-routes-legacy-settings-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Routes and Settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          routes=Path('routes.html')
          r=routes.read_text(encoding='utf-8')
          anchor='<script src="auth.js?v=11.0"></script>\n<script src="topbar.js?v=11.0"></script>'
          replacement='<script src="auth.js?v=11.0"></script>\n<script src="sync.js?v=11.0"></script>\n<script src="topbar.js?v=11.0"></script>'
          if r.count(anchor)!=1:
            raise SystemExit('Routes script anchor count != 1')
          r=r.replace(anchor,replacement,1)
          routes.write_text(r,encoding='utf-8')

          settings=Path('settings.html')
          s=settings.read_text(encoding='utf-8')
          replacements=[
            ('<div class="sec-title">Daily quests</div>', '<div class="sec-title">Legacy daily quest selection · inactive</div>'),
            ('<div style="font-size:11px;color:var(--t3);margin-bottom:12px">Your daily quest lineup.</div>',
             '<div style="font-size:11px;color:var(--t3);line-height:1.5">This older quest selector is no longer used by the current Daily Missions. The current mission lineup comes from the canonical RPG habit definitions.</div>'),
            ('    renderDailyQuestToggles();', '    // Legacy rpg_active_quests_v1 selector intentionally not rendered.')
          ]
          for old,new in replacements:
            if s.count(old)!=1:
              raise SystemExit('Settings legacy UI anchor count != 1: '+old[:70])
            s=s.replace(old,new,1)

          pattern=re.compile(r"window\.toggleQuest = function\(id, checked\) \{[\s\S]*?\n\};")
          matches=pattern.findall(s)
          if len(matches)!=1:
            raise SystemExit('toggleQuest block count != 1')
          s=pattern.sub("window.toggleQuest = function(){\n  showToast('Legacy quest selection is inactive');\n  return false;\n};",s,count=1)
          settings.write_text(s,encoding='utf-8')
          PY
      - name: Commit exact fixes and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-routes-legacy-settings-fix.yml
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes.html settings.html .github/workflows/one-time-routes-legacy-settings-fix.yml
          git commit -m "ChatGPT: sync Routes and retire legacy Settings quest toggles"
          git push origin HEAD:main
