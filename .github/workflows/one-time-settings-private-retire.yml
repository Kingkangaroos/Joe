name: One-time Settings private boundary cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/one-time-settings-private-retire.py'
      - '.github/workflows/one-time-settings-private-retire.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Settings private boundary and retire stale quest map
        run: python scripts/one-time-settings-private-retire.py
      - name: Commit exact fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT (OpenAI)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add settings.html tests/settings-private-boundary-smoke.js
          git rm scripts/one-time-settings-private-retire.py .github/workflows/one-time-settings-private-retire.yml
          git commit -m 'ChatGPT: hide private skills from general Settings'
          git push origin HEAD:main
