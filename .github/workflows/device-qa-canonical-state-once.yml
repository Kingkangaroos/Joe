name: ChatGPT guarded Device QA canonical state
on:
  push:
    branches: [chatgpt/device-qa-canonical-state]
permissions:
  contents: write
jobs:
  patch-test-clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/device-qa-canonical-state
          fetch-depth: 0
      - name: Add read-only canonical local-state proof
        shell: python
        run: |
          from pathlib import Path
          p=Path('lab-iphone-device-qa.html')
          s=p.read_text()

          s=s.replace(
            '.safe-probes{display:grid;grid-template-columns:1fr 1fr;gap:7px}',
            '.safe-probes{display:grid;grid-template-columns:1fr 1fr;gap:7px}\n    .canonical-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}\n    .canonical-actions{display:flex;justify-content:flex-end;margin-top:9px}.canonical-actions button{min-height:36px;padding:7px 10px;font-size:9px}',
            1
          )
          s=s.replace(
            '<div class="notice"><strong>Alleen meten.</strong> Deze pagina laadt geen Auth, Supabase, sync, topbar of swipe-engine en schrijft niets naar localStorage. Voor de echte device-proof: open deze pagina vanuit je geïnstalleerde Gamenfy-app, niet alleen Safari.</div>',
            '<div class="notice"><strong>Alleen meten.</strong> Deze pagina laadt geen Auth, Supabase, sync, topbar of swipe-engine en schrijft niets naar localStorage. Hij leest alleen privacy-minimale counts/flags uit drie canonical keys (Goals, Fitbit reconcile state en habit history). Voor de echte device-proof: open deze pagina vanuit je geïnstalleerde Gamenfy-app, niet alleen Safari.</div>',
            1
          )
          anchor='''  <div class="section-title">Bottom-nav drift test</div>'''
          block='''  <div class="section-title">Canonical local state</div>
  <section class="card">
    <div class="meta">Alleen read-only bewijs op dit device. Geen Goal-titels, WHY-tekst of skill-links worden getoond of gekopieerd. Handig na <strong>Main</strong> openen: herlees daarna deze kaart om te zien of canonical Goals en Fitbit-migratiemarkers lokaal aanwezig zijn.</div>
    <div class="canonical-grid">
      <div class="metric"><span>Goals store</span><b id="localGoals">—</b><small class="meta" id="localGoalsMeta">—</small></div>
      <div class="metric"><span>Fitbit retrospective</span><b id="localRetrospective">—</b><small class="meta">historische replay-marker</small></div>
      <div class="metric"><span>XP ledger</span><b id="localXpLedger">—</b><small class="meta">exactly-once marker</small></div>
      <div class="metric"><span>Canonical history</span><b id="localHabitCounts">—</b><small class="meta">Walking / Sleep dagen</small></div>
    </div>
    <div class="canonical-actions"><button id="refreshLocalButton" type="button">Herlees local state</button></div>
  </section>

'''
          if anchor not in s: raise SystemExit('bottom-nav anchor missing')
          s=s.replace(anchor,block+anchor,1)

          js_anchor='''  function log(kind,detail){
    var t=new Date().toLocaleTimeString('nl-NL',{hour12:false});'''
          js_block='''  function readJsonKey(key){
    try{
      var raw=localStorage.getItem(key);
      if(raw===null)return {exists:false,value:null,valid:true};
      try{return {exists:true,value:JSON.parse(raw),valid:true};}
      catch(e){return {exists:true,value:null,valid:false};}
    }catch(e){return {exists:false,value:null,valid:false};}
  }
  function countTrueDays(log,key){
    var days=log&&log[key]&&typeof log[key]==='object'?log[key]:{};
    return Object.keys(days).filter(function(date){return !!days[date];}).length;
  }
  function readCanonicalLocalState(){
    var goalsRec=readJsonKey('rpg_goals_v1');
    var autoRec=readJsonKey('rpg_autohabit_v1');
    var logRec=readJsonKey('rpg_habitlog_v1');
    var goals=Array.isArray(goalsRec.value)?goalsRec.value:[];
    var auto=autoRec.value&&typeof autoRec.value==='object'?autoRec.value:{};
    var habitlog=logRec.value&&typeof logRec.value==='object'?logRec.value:{};
    var activeGoals=goals.filter(function(g){return g&&!g.archived&&Number(g.pct||0)<100;}).length;
    return {
      goalsPresent:goalsRec.exists&&goalsRec.valid&&Array.isArray(goalsRec.value),
      goalsValid:goalsRec.valid,
      localGoalsCount:goals.length,
      localActiveGoals:activeGoals,
      retrospectiveMigrated:auto.__retrospective_v2_migrated===true,
      xpLedgerMigrated:auto.__xp_ledger_v1_migrated===true,
      localWalkingDays:countTrueDays(habitlog,'walking'),
      localSleepDays:countTrueDays(habitlog,'sleep')
    };
  }
  function renderCanonicalLocalState(){
    var c=readCanonicalLocalState();
    $('localGoals').textContent=c.goalsPresent?(c.localGoalsCount+' goal'+(c.localGoalsCount===1?'':'s')):(c.goalsValid?'afwezig':'onleesbaar');
    $('localGoalsMeta').textContent=c.goalsPresent?(c.localActiveGoals+' actief/onafgerond'):'canonical rpg_goals_v1';
    $('localRetrospective').textContent=c.retrospectiveMigrated?'gedraaid ✓':'nog niet';
    $('localXpLedger').textContent=c.xpLedgerMigrated?'gedraaid ✓':'nog niet';
    $('localHabitCounts').textContent=c.localWalkingDays+' / '+c.localSleepDays;
    return c;
  }
'''
          if js_anchor not in s: raise SystemExit('JS log anchor missing')
          s=s.replace(js_anchor,js_block+js_anchor,1)

          s=s.replace(
            "    measure();\n  }\n  function diagnostics(){",
            "    measure();\n    renderCanonicalLocalState();\n  }\n  function diagnostics(){",
            1
          )
          s=s.replace(
            "    var st=standalone(),d=deviceInfo(),vv=window.visualViewport,cs=getComputedStyle(cssProbe);\n    return [",
            "    var st=standalone(),d=deviceInfo(),vv=window.visualViewport,cs=getComputedStyle(cssProbe),local=readCanonicalLocalState();\n    return [",
            1
          )
          diag_anchor="""      'maxFixedProbeDrift='+maxDrift.toFixed(1)+'px',
      'orientation='+((screen.orientation&&screen.orientation.type)||window.orientation||'unknown'),"""
          diag_block="""      'maxFixedProbeDrift='+maxDrift.toFixed(1)+'px',
      'localGoalsPresent='+local.goalsPresent+', localGoalsCount='+local.localGoalsCount+', localActiveGoals='+local.localActiveGoals,
      'localFitbitRetrospectiveMigrated='+local.retrospectiveMigrated+', localXpLedgerMigrated='+local.xpLedgerMigrated,
      'localWalkingDays='+local.localWalkingDays+', localSleepDays='+local.localSleepDays,
      'orientation='+((screen.orientation&&screen.orientation.type)||window.orientation||'unknown'),"""
          if diag_anchor not in s: raise SystemExit('diagnostic anchor missing')
          s=s.replace(diag_anchor,diag_block,1)

          s=s.replace(
            "  document.addEventListener('visibilitychange',function(){log('visibility',document.visibilityState);measure();});",
            "  document.addEventListener('visibilitychange',function(){log('visibility',document.visibilityState);measure();if(document.visibilityState==='visible')renderCanonicalLocalState();});",
            1
          )
          action_anchor="""  $('resetButton').addEventListener('click',function(){maxDrift=0;measure();log('max drift reset');});"""
          action_block="""  $('refreshLocalButton').addEventListener('click',function(){renderCanonicalLocalState();log('local canonical state reread');});
  window.addEventListener('pageshow',function(){renderCanonicalLocalState();});
"""
          if action_anchor not in s: raise SystemExit('action anchor missing')
          s=s.replace(action_anchor,action_block+action_anchor,1)
          p.write_text(s)
      - name: Run complete browserless regression suite
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove one-time workflow
        run: rm .github/workflows/device-qa-canonical-state-once.yml
      - name: Commit verified QA extension
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: add canonical local-state proof to Device QA [device-qa-canonical-state]"
          git push origin HEAD:chatgpt/device-qa-canonical-state
