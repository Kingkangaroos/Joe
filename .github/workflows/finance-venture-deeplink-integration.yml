name: Finance Venture deeplink integration

on:
  push:
    branches:
      - chatgpt/finance-venture-deeplink

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/finance-venture-deeplink
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply Finance deeplink patch
        run: python3 scripts/finance-venture-deeplink-patch.py
      - name: Run all smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove one-shot integration files
        run: |
          rm scripts/finance-venture-deeplink-patch.py
          rm .github/workflows/finance-venture-deeplink-integration.yml
      - name: Commit proven integration
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ventures: preserve Finance Venture Lab deeplinks"
          git push origin HEAD:chatgpt/finance-venture-deeplink
