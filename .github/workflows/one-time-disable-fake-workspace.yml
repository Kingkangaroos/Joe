name: One-time workspace safety cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-disable-fake-workspace.yml'

permissions:
  contents: write

jobs:
  patch-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Disable misleading workspace isolation UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('settings.html')
          text = p.read_text(encoding='utf-8')

          old_block = '''  <div class="sec-title" style="margin-top:24px">Workspace (v10.55)</div>
  <div style="background:var(--surface,rgba(255,255,255,0.04));border:1px solid var(--border,rgba(255,255,255,0.08));border-radius:14px;padding:14px">
    <div class="toggle-sub" style="margin-bottom:10px;line-height:1.5">
      This device is currently on: <b id="wsCurrentLabel" style="color:inherit">—</b><br>
      For a friend trying Gamenfy: give their device its own workspace name so their data stays completely separate from yours — same app, same Supabase project, different data entirely.
    </div>
    <div style="display:flex;gap:8px">
      <input type="text" id="wsNameInput" placeholder="e.g. alex, sam..." maxlength="24"
        style="flex:1;background:transparent;border:1px solid var(--border,rgba(255,255,255,0.15));border-radius:10px;color:inherit;padding:9px 10px;font-size:13px;font-family:inherit">
      <button class="assess-btn" style="margin:0;padding:9px 16px;white-space:nowrap" onclick="saveWorkspace()"><span>Set</span></button>
    </div>
    <div class="toggle-sub" style="margin-top:10px">
      Leave empty and press Set to switch a device back to the main/shared workspace — only do this deliberately, since it means that device will then see the SAME data as your main workspace.
    </div>
  </div>'''
          new_block = '''  <div class="sec-title" style="margin-top:24px">Workspace · not active yet</div>
  <div style="background:var(--surface,rgba(255,255,255,0.04));border:1px solid var(--border,rgba(255,255,255,0.08));border-radius:14px;padding:14px">
    <div class="toggle-sub" style="line-height:1.55">
      Separate cloud workspaces are not enabled yet. Signed-in devices currently use the same owner-scoped Gamenfy cloud rows. Do not use this as a friend/test-user isolation feature until the sync + direct integrations are workspace-aware.
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;opacity:.55">
      <input type="text" id="wsNameInput" placeholder="Workspace isolation unavailable" maxlength="24" disabled
        style="flex:1;background:transparent;border:1px solid var(--border,rgba(255,255,255,0.15));border-radius:10px;color:inherit;padding:9px 10px;font-size:13px;font-family:inherit">
      <button class="assess-btn" style="margin:0;padding:9px 16px;white-space:nowrap" type="button" disabled><span>Set</span></button>
    </div>
  </div>'''
          if old_block not in text:
              raise SystemExit('Expected workspace UI block not found')
          text = text.replace(old_block, new_block, 1)

          pattern = re.compile(r'''\n  // v10\.55: Workspace — deliberately NOT stored in rpg_prefs_v1 \(which syncs[\s\S]*?\n  window\.saveWorkspace = function\(\)\{[\s\S]*?\n  \};''')
          replacement = '''
  // Workspace isolation is intentionally disabled until sync.js and every
  // direct app_state integration use the same owner+workspace namespace.
  window.saveWorkspace = function(){
    alert('Separate cloud workspaces are not active yet.');
    return false;
  };'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Expected workspace behavior block not found')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-disable-fake-workspace.yml
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.html .github/workflows/one-time-disable-fake-workspace.yml
          git commit -m "ChatGPT: disable misleading workspace isolation UI"
          git push origin HEAD:main
