name: Stage 2B guarded sync integration

on:
  push:
    branches:
      - chatgpt/app-state-rpc-sync-stage2b

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/app-state-rpc-sync-stage2b
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Repair patch scope and apply guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/stage2b-sync-patch.js')
          s = p.read_text()

          # Keep the generated plan assertion simple; backticks inside the JS
          # template literal are not part of the product contract.
          lines = s.splitlines()
          found_plan = False
          for i, line in enumerate(lines):
              if 'assert.match(plan,/Do ' in line:
                  lines[i] = r"assert.match(plan,/Do \\*\\*not\\*\\* drop/i);"
                  found_plan = True
          if not found_plan:
              raise SystemExit('owner-plan assertion marker not found')
          s = '\n'.join(lines) + '\n'

          # Critical Stage 2B fix: the original init regex started at any
          # `await supa...`, so after inserting pushNow it could start at the new
          # RPC call and delete the writer again. Anchor the match to the exact
          # legacy initial pull that exists on main.
          old = r"const \{ data, error \} = await supa[\s\S]*?"
          new = r"const \{ data, error \} = await supa\n          \.from\('app_state'\)\n          \.select\('data,updated_at,restore_generation'\)[\s\S]*?"
          if old not in s:
              raise SystemExit('broad init-pull regex marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node scripts/stage2b-sync-patch.js

          grep -F "supa.rpc('gamenfy_write_app_state'" sync.js
          grep -F "/rest/v1/rpc/gamenfy_write_app_state" sync.js
          if grep -F ".from('app_state').upsert(" sync.js; then
            echo 'direct app_state upsert survived Stage 2B patch' >&2
            exit 1
          fi
      - name: Install literal Stage 2B contract tests
        shell: bash
        run: |
          cat > tests/app-state-owner-generation-smoke.js <<'EOF'
          /* app_state owner + generation/version client contract — ChatGPT (OpenAI), 2026-09-06 */
          'use strict';
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const root=path.join(__dirname,'..');
          const sync=fs.readFileSync(path.join(root,'sync.js'),'utf8');
          const phase0=fs.readFileSync(path.join(root,'server','database','app-state-owner-scope-phase0.sql'),'utf8');
          const plan=fs.readFileSync(path.join(root,'APP-STATE-OWNER-SCOPE-CUTOVER.md'),'utf8');
          function has(text, needle, label){ assert.ok(text.includes(needle), label || ('missing: '+needle)); }
          function lacks(text, needle, label){ assert.ok(!text.includes(needle), label || ('must not contain: '+needle)); }

          has(phase0,'add column if not exists restore_generation bigint not null default 0');
          has(phase0,'unique (user_id, key)');
          lacks(phase0,'drop constraint app_state_pkey','Phase 0 must retain the legacy PK');
          has(plan,'Phase 0 live');
          has(plan,'Do **not** drop');

          has(sync,'let restoreGeneration = 0;');
          has(sync,'let stateVersion = 0;');
          has(sync,'generation: restoreGeneration');
          has(sync,'dirtyGeneration(d) !== remoteGeneration');
          has(sync,'remoteGeneration < restoreGeneration');
          has(sync,'remoteVersion < stateVersion');
          has(sync,'remoteGeneration > restoreGeneration');
          has(sync,".select('data,updated_at,restore_generation,state_version')");
          has(sync,".eq('user_id', window.gamenfyUserId)");
          has(sync,"supa.rpc('gamenfy_write_app_state'");
          has(sync,'p_expected_generation: expectedGeneration');
          has(sync,'p_expected_version: expectedVersion');
          has(sync,"/rest/v1/rpc/gamenfy_write_app_state");
          lacks(sync,".from('app_state').upsert(",'modern sync must not directly upsert app_state');
          lacks(sync,'/rest/v1/app_state?on_conflict=','modern unload must not bypass the RPC');
          lacks(sync,"onConflict: 'key'");
          console.log('app_state owner/generation/version smoke passed: browser reads are explicit-owner and writes use the generation+state_version CAS RPC, including unload.');
          EOF

          cat > tests/app-state-rpc-sync-smoke.js <<'EOF'
          /* Stage 2B RPC sync regression — ChatGPT (OpenAI), 2026-09-06 */
          'use strict';
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const sync=fs.readFileSync(path.join(__dirname,'..','sync.js'),'utf8');
          function has(needle,label){ assert.ok(sync.includes(needle), label || ('missing: '+needle)); }
          function lacks(needle,label){ assert.ok(!sync.includes(needle), label || ('must not contain: '+needle)); }

          has('v11.9 server CAS write gate');
          has('let stateVersion = 0;');
          has('let reconcileInFlight = null;');
          has('function reconcileRemoteRow(');
          has('remoteGeneration === restoreGeneration && remoteVersion < stateVersion');
          has('remoteGeneration === restoreGeneration && remoteVersion === stateVersion && remoteMs && remoteMs < highWaterMs');
          has('stateVersion = Math.max(stateVersion, remoteVersion);');
          has("supa.rpc('gamenfy_write_app_state'");
          has('p_expected_generation: expectedGeneration');
          has('p_expected_version: expectedVersion');
          has('ackVersion !== expectedVersion + 1','RPC acknowledgement must advance exactly one CAS version');
          has('newerAlreadyKnown','late ACK must not roll local watermark behind newer realtime state');
          has('clearDirtyThrough(cutoff);','only pre-call dirty entries may clear after ACK');
          has('isCasConflict(error)');
          has("pullAndReconcile(true, 'cas-conflict')");
          has("fetch(SUPABASE_URL + '/rest/v1/rpc/gamenfy_write_app_state'");

          const start=sync.indexOf('function flushOnUnload()');
          const end=sync.indexOf('(async function init()',start);
          assert.ok(start>=0 && end>start,'flushOnUnload block must be discoverable');
          const unload=sync.slice(start,end);
          assert.ok(unload.includes('p_expected_generation: restoreGeneration'));
          assert.ok(unload.includes('p_expected_version: stateVersion'));
          assert.ok(unload.includes('keepalive: true'));
          assert.ok(!unload.includes('clearDirtyThrough'),'fire-and-forget unload may not clear dirty state');
          assert.ok(!unload.includes('user_id:'),'RPC owner must come from auth context');

          lacks(".from('app_state').upsert(");
          lacks('/rest/v1/app_state?on_conflict=');
          lacks('gamenfy_restore_app_state','Stage 2B must not expose restore');
          console.log('Stage 2B RPC sync smoke passed: CAS versioning, stale-event rejection, conflict fresh-pull, safe late ACK and keepalive RPC are locked.');
          EOF
      - name: Run all smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove one-shot integration files
        run: |
          rm scripts/stage2b-sync-patch.js
          rm .github/workflows/stage2b-sync-integration.yml
      - name: Commit proven integration
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: move browser app_state writes behind CAS RPC"
          git push origin HEAD:chatgpt/app-state-rpc-sync-stage2b
