name: One-time Settings legacy security cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/one-time-settings-legacy-security.py'
      - '.github/workflows/one-time-settings-legacy-security.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Settings legacy reminder and quote rendering
        run: python scripts/one-time-settings-legacy-security.py
      - name: Commit exact fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT (OpenAI)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add settings.html tests/settings-security-push-legacy-smoke.js
          git rm scripts/one-time-settings-legacy-security.py .github/workflows/one-time-settings-legacy-security.yml
          git commit -m 'ChatGPT: harden Settings quotes and retire legacy reminder UI'
          git push origin HEAD:main
