name: ChatGPT guarded iPhone Device QA Lab integration
on:
  push:
    branches: [chatgpt/iphone-device-qa-lab]
permissions:
  contents: write
jobs:
  integrate-test-clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/iphone-device-qa-lab
          fetch-depth: 0
      - name: Add Device QA card to ChatGPT Lab
        shell: python
        run: |
          from pathlib import Path
          p=Path('lab.html')
          s=p.read_text()
          if 'lab-iphone-device-qa.html' not in s:
              needle='''      <div class="chatgpt-lab-card">\n        <span class="chatgpt-lab-icon">🌳</span>\n        <span><strong>Park 2.0</strong><small>8 levende skill-companions</small></span>\n        <em>Referentie</em>\n      </div>'''
              card='''      <a href="lab-iphone-device-qa.html" class="chatgpt-lab-card" aria-label="Open iPhone Device QA Lab">\n        <span class="chatgpt-lab-icon">📱</span>\n        <span><strong>iPhone Device QA</strong><small>Standalone, safe-area & bottom-nav drift</small></span>\n        <em>Device test</em>\n      </a>\n'''
              if needle not in s:
                  raise SystemExit('Park 2 Lab card anchor missing')
              s=s.replace(needle,card+needle,1)
              p.write_text(s)
      - name: Run complete browserless regression suite
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove one-time workflow
        run: rm .github/workflows/iphone-device-qa-once.yml
      - name: Commit verified Device QA Lab integration
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ChatGPT: integrate iPhone Device QA Lab [iphone-device-qa-integrated]"
          git push origin HEAD:chatgpt/iphone-device-qa-lab
