name: ChatGPT guarded Restore Dry Run Lab integration

on:
  push:
    branches: [chatgpt/restore-dry-run-lab]

permissions:
  contents: write

jobs:
  integrate-test-clean:
    if: ${{ !contains(github.event.head_commit.message, '[restore-dry-run-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Lab branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/restore-dry-run-lab
          fetch-depth: 0

      - name: Add Restore Dry Run card to ChatGPT Lab
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lab.html')
          s=p.read_text()
          if 'href="lab-restore-dry-run.html"' not in s:
              anchor='''      <a href="lab-why-audit.html" class="chatgpt-lab-card" aria-label="Open WHY Link Audit Lab">\n        <span class="chatgpt-lab-icon">🎯</span>\n        <span><strong>WHY Link Audit</strong><small>Check Goals, WHY en expliciete skill-links</small></span>\n        <em>Nieuw</em>\n      </a>'''
              card='''      <a href="lab-restore-dry-run.html" class="chatgpt-lab-card" aria-label="Open Restore Dry Run Lab">\n        <span class="chatgpt-lab-icon">🛡️</span>\n        <span><strong>Restore Dry Run</strong><small>Valideer backup en preview merge/overwrite</small></span>\n        <em>Safe Lab</em>\n      </a>'''
              if anchor not in s:
                  raise SystemExit('WHY Link Audit card anchor not found')
              s=s.replace(anchor,anchor+'\n'+card,1)
          p.write_text(s)

          t=Path('tests/restore-dry-run-smoke.js')
          q=t.read_text()
          line="const labIndex=fs.readFileSync(path.join(root,'lab.html'),'utf8');"
          if line not in q:
              q=q.replace("const spec=fs.readFileSync(path.join(root,'RESTORE-IMPORT-SPEC.md'),'utf8');", "const spec=fs.readFileSync(path.join(root,'RESTORE-IMPORT-SPEC.md'),'utf8');\n"+line)
          guard="assert.match(labIndex,/href=\"lab-restore-dry-run\\.html\"/,'normal ChatGPT Lab must expose the Restore Dry Run');"
          if guard not in q:
              q=q.replace("console.log('Restore Dry Run smoke:", guard+"\nconsole.log('Restore Dry Run smoke:")
          t.write_text(q)
          PY

      - name: Run complete browserless regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

      - name: Remove one-time workflow
        shell: bash
        run: git rm .github/workflows/restore-dry-run-once.yml

      - name: Commit verified Lab integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: integrate Restore Dry Run Lab [restore-dry-run-integrated]"
          git push origin HEAD:chatgpt/restore-dry-run-lab
