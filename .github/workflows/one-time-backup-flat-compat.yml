name: One-time backup flat compatibility

on:
  push:
    branches: [main]
    paths:
      - 'scripts/one-time-backup-flat-compat.py'
      - '.github/workflows/one-time-backup-flat-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preserve exact raw flat backup representation
        run: python scripts/one-time-backup-flat-compat.py
      - name: Commit exact fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT (OpenAI)'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add character.html tests/cloud-backup-smoke.js
          git rm scripts/one-time-backup-flat-compat.py .github/workflows/one-time-backup-flat-compat.yml
          git commit -m 'ChatGPT: preserve exact flat backup representation'
          git push origin HEAD:main
