name: Body Fitbit read hardening

on:
  push:
    branches:
      - chatgpt/body-fitbit-read-hardening

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/body-fitbit-read-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply Body Fitbit patch
        run: python3 scripts/body-fitbit-read-hardening-patch.py
      - name: Run all smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove one-shot integration files
        run: |
          rm scripts/body-fitbit-read-hardening-patch.py
          rm .github/workflows/body-fitbit-read-hardening.yml
      - name: Commit proven integration
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "health: harden Body Fitbit owner reads"
          git push origin HEAD:chatgpt/body-fitbit-read-hardening
