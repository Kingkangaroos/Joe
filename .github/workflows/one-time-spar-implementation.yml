name: One-time ChatGPT spar implementation

on:
  push:
    branches:
      - chatgpt/builder-2026-09-05-afternoon
    paths:
      - '.github/workflows/one-time-spar-implementation.yml'

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/builder-2026-09-05-afternoon

      - name: Apply exact guarded patch
        run: python3 scripts/one-time-spar-implementation.py

      - name: Run all browserless smoke tests
        run: |
          set -euo pipefail
          for f in tests/*smoke.js; do
            echo "==> $f"
            node "$f"
          done

      - name: Commit tested implementation and remove one-time helpers
        run: |
          set -euo pipefail
          rm -f scripts/one-time-spar-implementation.py .github/workflows/one-time-spar-implementation.yml
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: implement sparring product pass"
          git push origin HEAD:chatgpt/builder-2026-09-05-afternoon
