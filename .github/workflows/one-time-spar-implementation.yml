name: One-time ChatGPT spar implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/builder-2026-09-05-afternoon

      - name: Apply exact guarded patch
        run: python3 scripts/one-time-spar-implementation.py

      - name: Align Park smoke contracts with Daily Missions 2.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/park31-smoke.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(r'1\.14', r'1\.15').replace('v=1.14', 'v=1.15')
          old = r"assert.doesNotMatch(home,/park31\.html\?embed=1&amp;mode=missions/);"
          new = r"assert.match(home,/park31\.html\?embed=1&amp;mode=missions&amp;privacy=public/,'Home uses the approved public-only Daily Missions 2.0 surface');"
          if old not in s:
              raise SystemExit('Park Home guard anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Run all browserless smoke tests
        run: |
          set -euo pipefail
          for f in tests/*smoke.js; do
            echo "==> $f"
            node "$f"
          done

      - name: Commit tested implementation and remove one-time helpers
        run: |
          set -euo pipefail
          rm -f scripts/one-time-spar-implementation.py .github/workflows/one-time-spar-implementation.yml
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: implement sparring product pass"
          git push origin HEAD:chatgpt/builder-2026-09-05-afternoon
