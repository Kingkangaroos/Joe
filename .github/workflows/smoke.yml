name: Gamenfy smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browserless regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run all smoke tests
        shell: bash
        run: |
          set -uo pipefail
          : > smoke-results.txt
          status=0
          for test in tests/*-smoke.js; do
            echo "=== $test ===" | tee -a smoke-results.txt
            if node "$test" 2>&1 | tee -a smoke-results.txt; then
              echo "PASS $test" | tee -a smoke-results.txt
            else
              echo "FAIL $test" | tee -a smoke-results.txt
              status=1
            fi
            echo | tee -a smoke-results.txt
          done
          exit "$status"

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.run_id }}
          path: smoke-results.txt
          if-no-files-found: error
          retention-days: 3
