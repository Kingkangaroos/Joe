name: One-time Jarvis client reliability fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-jarvis-client-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Jarvis auth init and input collisions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jarvis.html')
          t=p.read_text(encoding='utf-8')
          repl=[
            ("async function jvSend(){\n  if(jvBusy) return;",
             "async function jvSend(){\n  if(jvBusy || (jvRec && jvRec.state==='recording')) return;"),
            ("  jvBusy=true;\n  document.getElementById('jvSend').disabled=true;\n  const think=jvAdd('bot','…','thinking');",
             "  jvBusy=true;\n  document.getElementById('jvSend').disabled=true;\n  document.getElementById('jvMic').disabled=true;\n  const think=jvAdd('bot','…','thinking');"),
            ("  jvBusy=false;\n  document.getElementById('jvSend').disabled=false;\n  document.getElementById('jvMsgs').scrollTop=document.getElementById('jvMsgs').scrollHeight;\n}\n\n// ── Spraakberichten",
             "  jvBusy=false;\n  document.getElementById('jvSend').disabled=false;\n  document.getElementById('jvMic').disabled=false;\n  document.getElementById('jvMsgs').scrollTop=document.getElementById('jvMsgs').scrollHeight;\n}\n\n// ── Spraakberichten"),
            ("window.jvMicTap=async function(){\n  const btn=document.getElementById('jvMic');",
             "window.jvMicTap=async function(){\n  const btn=document.getElementById('jvMic');\n  if(jvBusy) return;"),
            ("    btn.classList.remove('rec'); btn.textContent='🎤';\n    stream.getTracks().forEach(t=>t.stop());\n    const blob=new Blob(jvChunks,{type:mime});\n    if(blob.size<1200) return; // te kort / per ongeluk",
             "    btn.classList.remove('rec'); btn.textContent='🎤'; btn.disabled=true;\n    stream.getTracks().forEach(t=>t.stop());\n    const blob=new Blob(jvChunks,{type:mime});\n    if(blob.size<1200){ btn.disabled=false; document.getElementById('jvSend').disabled=false; return; } // te kort / per ongeluk"),
            ("  jvRec.start();\n  btn.classList.add('rec'); btn.textContent='■';",
             "  jvRec.start();\n  document.getElementById('jvSend').disabled=true;\n  btn.classList.add('rec'); btn.textContent='■';"),
            ("async function jvSendAudio(b64, mime){\n  if(jvBusy) return;\n  jvBusy=true;\n  document.getElementById('jvSend').disabled=true;",
             "async function jvSendAudio(b64, mime){\n  if(jvBusy) return;\n  jvBusy=true;\n  document.getElementById('jvSend').disabled=true;\n  document.getElementById('jvMic').disabled=true;"),
            ("  jvBusy=false;\n  document.getElementById('jvSend').disabled=false;\n  document.getElementById('jvMsgs').scrollTop=document.getElementById('jvMsgs').scrollHeight;\n}\n\ndocument.getElementById('jvInput').addEventListener('keydown',e=>{ if(e.key==='Enter') jvSend(); });\njvLoadHistory();",
             "  jvBusy=false;\n  document.getElementById('jvSend').disabled=false;\n  document.getElementById('jvMic').disabled=false;\n  document.getElementById('jvMsgs').scrollTop=document.getElementById('jvMsgs').scrollHeight;\n}\n\ndocument.getElementById('jvInput').addEventListener('keydown',e=>{ if(e.key==='Enter') jvSend(); });\ndocument.addEventListener('DOMContentLoaded',async()=>{\n  try{ if(window.gamenfyAuthReady) await window.gamenfyAuthReady; }catch(e){}\n  jvLoadHistory();\n});")
          ]
          for old,new in repl:
            if t.count(old)!=1:
              raise SystemExit('Jarvis patch anchor count != 1: '+old[:70])
            t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-jarvis-client-fix.yml
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jarvis.html .github/workflows/one-time-jarvis-client-fix.yml
          git commit -m "ChatGPT: harden Jarvis history and voice client state"
          git push origin HEAD:main
