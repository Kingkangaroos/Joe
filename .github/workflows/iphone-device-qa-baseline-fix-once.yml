name: ChatGPT guarded iPhone QA baseline correction
on:
  push:
    branches: [chatgpt/iphone-device-qa-baseline-fix]
permissions:
  contents: write
jobs:
  patch-test-clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA fix branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/iphone-device-qa-baseline-fix
          fetch-depth: 0
      - name: Correct fixed-probe zero baseline
        shell: python
        run: |
          from pathlib import Path
          p=Path('lab-iphone-device-qa.html')
          s=p.read_text()
          old='''    var vv=window.visualViewport;\n    var rect=$(\'fixedProbe\').getBoundingClientRect();\n    var visualBottom=vv?(vv.offsetTop+vv.height):window.innerHeight;\n    var drift=rect.bottom-visualBottom;\n    var abs=Math.abs(drift);'''
          new='''    var vv=window.visualViewport;\n    var rect=$(\'fixedProbe\').getBoundingClientRect();\n    var visualBottom=vv?(vv.offsetTop+vv.height):window.innerHeight;\n    var cs=getComputedStyle(cssProbe);\n    var safeBottom=px(cs.paddingBottom);\n    var expectedBottom=visualBottom-(8+safeBottom);\n    var drift=rect.bottom-expectedBottom;\n    var abs=Math.abs(drift);'''
          if old not in s:
              raise SystemExit('old drift block missing')
          s=s.replace(old,new,1)
          old2='''    $(\'probeMeta\').textContent=\'visual bottom \'+Math.round(visualBottom)+\' · rect \'+Math.round(rect.bottom);\n    $(\'windowViewport\').textContent=Math.round(innerWidth)+\'×\'+Math.round(innerHeight);\n    $(\'visualViewport\').textContent=vv?Math.round(vv.width)+\'×\'+Math.round(vv.height):\'niet beschikbaar\';\n    $(\'visualOffset\').textContent=vv?vv.offsetTop.toFixed(1)+\' / \'+vv.offsetLeft.toFixed(1)+\' · \'+vv.scale.toFixed(2):\'—\';\n    var cs=getComputedStyle(cssProbe);\n    $(\'safeTop\').textContent=px(cs.paddingTop).toFixed(1)+\' px gemeten\';\n    $(\'safeBottom\').textContent=px(cs.paddingBottom).toFixed(1)+\' px gemeten\';'''
          new2='''    $(\'probeMeta\').textContent=\'expected \'+Math.round(expectedBottom)+\' · rect \'+Math.round(rect.bottom)+\' · safe \'+safeBottom.toFixed(0);\n    $(\'windowViewport\').textContent=Math.round(innerWidth)+\'×\'+Math.round(innerHeight);\n    $(\'visualViewport\').textContent=vv?Math.round(vv.width)+\'×\'+Math.round(vv.height):\'niet beschikbaar\';\n    $(\'visualOffset\').textContent=vv?vv.offsetTop.toFixed(1)+\' / \'+vv.offsetLeft.toFixed(1)+\' · \'+vv.scale.toFixed(2):\'—\';\n    $(\'safeTop\').textContent=px(cs.paddingTop).toFixed(1)+\' px gemeten\';\n    $(\'safeBottom\').textContent=safeBottom.toFixed(1)+\' px gemeten\';'''
          if old2 not in s:
              raise SystemExit('old probe metadata block missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Run complete browserless regression suite
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove one-time workflow
        run: rm .github/workflows/iphone-device-qa-baseline-fix-once.yml
      - name: Commit verified baseline correction
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: correct iPhone QA drift zero baseline [iphone-qa-baseline-fixed]"
          git push origin HEAD:chatgpt/iphone-device-qa-baseline-fix
