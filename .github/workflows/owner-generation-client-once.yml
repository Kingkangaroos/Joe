name: Owner generation client once

on:
  push:
    branches:
      - chatgpt/owner-generation-client

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/owner-generation-client

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply guarded owner/generation patch
        run: python .github/scripts/owner_generation_client_patch.py

      - name: Run complete browserless regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

      - name: Remove one-time integration files
        run: |
          rm .github/scripts/owner_generation_client_patch.py
          rm .github/workflows/owner-generation-client-once.yml

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ChatGPT: make sync owner-scoped and generation-aware [owner-generation-client]"
          git push origin HEAD:chatgpt/owner-generation-client
