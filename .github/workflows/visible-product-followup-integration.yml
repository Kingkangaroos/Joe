name: Visible product follow-up integration

on:
  push:
    branches:
      - chatgpt/visible-product-followup-sept6

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/visible-product-followup-sept6
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply follow-up patch
        run: python3 scripts/visible-product-followup-sept6.py
      - name: Run all smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*-smoke.js; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
      - name: Remove one-shot files
        run: |
          rm scripts/visible-product-followup-sept6.py
          rm .github/workflows/visible-product-followup-integration.yml
      - name: Commit proven follow-up
        run: |
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "product: restore venture structure and unify missions"
          git push origin HEAD:chatgpt/visible-product-followup-sept6
