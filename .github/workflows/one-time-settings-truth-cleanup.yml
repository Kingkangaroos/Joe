name: One-time Settings backend truth cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-settings-truth-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch Settings copy and dead workspace handler
        run: python3 tools/one-time-settings-truth-cleanup.py
      - name: Commit exact fix and remove helpers
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-settings-truth-cleanup.yml tools/one-time-settings-truth-cleanup.py
          git config user.name "ChatGPT (OpenAI)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.html .github/workflows/one-time-settings-truth-cleanup.yml tools/one-time-settings-truth-cleanup.py
          git commit -m "ChatGPT: align Settings copy with live backend"
          git push origin HEAD:main
