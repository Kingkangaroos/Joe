<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>Gamenfy · laden</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html,body{margin:0;min-height:100%;background:#F4F3EF;color:#15140F;font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,390px);background:#fff;border:1px solid #E8E6DF;border-radius:22px;padding:24px;box-sizing:border-box;box-shadow:0 18px 60px rgba(21,20,15,.1)}.k{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#D4633E;margin-bottom:8px}h1{font-size:22px;line-height:1.15;margin:0 0 8px}.s{font-size:13px;color:#6F6C63;line-height:1.45}
</style>
</head>
<body>
<div class="card"><div class="k">Gamenfy · privé</div><h1>Je data laden…</h1><div class="s" id="s">Private RPG-state controleren.</div></div>
<script>
(function(){
  'use strict';
  const OWNER='dff21e4f-51fa-468b-9e0d-2344164efd79';
  const URL='https://ttxjsoahmtennnufgeqx.supabase.co';
  const KEY='sb_publishable_5lYXJme36ggS2dWTJbMSCA_Ir9Uogab';
  const DIRTY='__gamenfy_sync_dirty_v1:rpg';
  const DEST='/private-app?rehydrated=1';
  const status=document.getElementById('s');

  function parse(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null}catch(_e){return null}}
  function stats(char){
    const skills=char&&char.skills&&typeof char.skills==='object'?char.skills:{};
    const log=char&&Array.isArray(char.xpLog)?char.xpLog:[];
    let totalXp=0;
    Object.keys(skills).forEach(k=>{const n=Number(skills[k]&&skills[k].xp);if(Number.isFinite(n)&&n>0)totalXp+=n});
    return {skillCount:Object.keys(skills).length,xpLogCount:log.length,totalXp};
  }
  function mature(st){return st.skillCount>=20&&st.xpLogCount>=20&&st.totalXp>=250}
  function rawSet(k,v){try{Storage.prototype.setItem.call(localStorage,k,v)}catch(_e){localStorage.setItem(k,v)}}
  function rawRemove(k){try{Storage.prototype.removeItem.call(localStorage,k)}catch(_e){localStorage.removeItem(k)}}
  function go(){location.replace(DEST)}

  async function run(){
    const localStats=stats(parse('rpg_character_v1'));
    if(mature(localStats)){go();return}
    status.textContent='Cloudprofiel ophalen…';
    if(!window.supabase||!window.supabase.createClient){status.textContent='Verbinding kon niet laden.';return}
    const client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'gamenfy-private-auth-v1'}});
    const {data:sessData,error:sessErr}=await client.auth.getSession();
    if(sessErr){status.textContent='Sessie kon niet worden gecontroleerd.';return}
    const session=sessData&&sessData.session;
    if(!session||!session.user){go();return}
    if(session.user.id!==OWNER){status.textContent='Dit is niet het private account.';return}
    const {data:row,error}=await client.from('app_state').select('data,updated_at,state_version,restore_generation').eq('user_id',OWNER).eq('key','rpg').maybeSingle();
    if(error||!row||!row.data){status.textContent='Clouddata kon niet veilig worden geladen.';return}
    const remoteStats=stats(row.data.rpg_character_v1);
    if(!mature(remoteStats)){status.textContent='Cloudprofiel lijkt onverwacht leeg; herstel gestopt.';return}

    rawRemove(DIRTY);
    Object.keys(row.data).forEach(k=>rawSet(k,JSON.stringify(row.data[k])));
    rawSet('gamenfy_private_rpg_bootstrap_repair_v2',JSON.stringify({at:new Date().toISOString(),updatedAt:row.updated_at||null,stateVersion:Number(row.state_version)||0,remoteStats,previousLocalStats:localStats}));
    status.textContent='Data teruggezet · '+remoteStats.skillCount+' skills · '+remoteStats.xpLogCount+' XP-events.';
    setTimeout(go,180);
  }
  run().catch(()=>{status.textContent='Herstel kon niet veilig worden uitgevoerd.'});
})();
</script>
</body>
</html>
